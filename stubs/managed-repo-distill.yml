# Copy this file into each managed repo at .github/workflows/distill.yml
# Replace YOUR-USERNAME with your GitHub username/org.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.
#
# Deliberately workflow_dispatch only — no `schedule:` block, unlike every
# other lane's stub. This is not an oversight (see #165, where a missing
# "why no cron" explanation on a stub cost two days before it was read as
# one): distill deletes content from AGENTS.md, and what it's allowed to
# touch is a fixed allowlist (`DistillConfig.protected_sections`, the six
# `templates/project/AGENTS.md` headings) rather than something it infers —
# a human who adds a new heading without updating that list gets it pruned
# silently. It also has no evidence gate the way evolve waits on
# `--min-runs`; its only trigger is `min_lines: 200`, "the file got long",
# which says nothing about whether the file should actually be shortened.
# On a schedule, a surprising prune lands unprompted on a repo nobody was
# thinking about; on a button, a human chose that moment. Adding a cron
# later is two lines; undoing a prune of hand-written content is not.
# Decided in #198 — read it before adding a `schedule:` here.
#
# A distill PR's checks tab will be empty: the pipeline pushes the branch
# with the default GITHUB_TOKEN, and GitHub does not fire workflow runs off
# of GITHUB_TOKEN-authored pushes. That's expected, not a CI failure — these
# PRs are human-merge-only, so merge on review as usual.

name: Agent Distill

on:
  workflow_dispatch: {} # manual "run now" button — no schedule, see above

jobs:
  distill:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: write
      pull-requests: write
    uses: YOUR-USERNAME/agent-ops/.github/workflows/distill-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      # runner: blacksmith-2vcpu-ubuntu-2404  # optional: faster/cheaper runners (org repos only)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
