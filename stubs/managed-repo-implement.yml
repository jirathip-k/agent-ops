# Copy this file into each managed repo at .github/workflows/implement.yml.
# Replace YOUR-USERNAME with your GitHub username/org.
#
# Required repository secrets:
# - CLAUDE_CODE_OAUTH_TOKEN for Claude-configured roles
# - OPENAI_API_KEY for Codex-configured roles, protected by codex-action's proxy
#
# Manual-only by design (#296): a human must choose one explicit issue. There
# is no cron or queue scan while the hybrid lane proves its safety and runtime
# composition alongside the existing triage implementation path.

name: Agent Implement

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Exact GitHub issue number to implement"
        required: true
        type: number

jobs:
  implement:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: YOUR-USERNAME/agent-ops/.github/workflows/implement-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      issue: ${{ inputs.issue }}
      # runner: blacksmith-2vcpu-ubuntu-2404  # optional: org runners
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
