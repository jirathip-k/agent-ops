# Copy this file into each managed repo at .github/workflows/plan.yml
# Replace YOUR-USERNAME with your GitHub username/org.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.
#
# Runs nightly and on demand: label an issue `plan-requested`, then wait
# for the nightly run or press "Run workflow". The pipeline is label-gated,
# so a night with no labeled issues skips the Claude session and costs
# nothing.

name: Agent Plan

on:
  schedule:
    # Staggered 20 minutes after spec: both lanes share the
    # agent-triage-<repo> concurrency group (cancel-in-progress: false), so
    # a repo is never planned while it is being specced/groomed/triaged.
    - cron: '20 19 * * *'
  workflow_dispatch: {}   # manual "run now" button

jobs:
  plan:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: read
      issues: write
    uses: YOUR-USERNAME/agent-ops/.github/workflows/plan-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      # issue: 123      # optional: plan one specific issue instead of by label
      # max_issues: 2   # optional: cap label-selected issues per run
      # runner: blacksmith-2vcpu-ubuntu-2404  # optional: faster/cheaper runners (org repos only)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
