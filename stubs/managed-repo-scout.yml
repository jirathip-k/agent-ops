# Copy this file into each managed repo at .github/workflows/scout.yml
# Replace YOUR-USERNAME with your GitHub username/org.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.
#
# Scout only files capped backlog issues (backlog + proposed-by-agent) — it
# never changes code, so it's safe to deploy anywhere the issue noise is
# acceptable. Filed issues enter the same groom/spec funnel as human ones.

name: Daily Agent Scout

on:
  schedule:
    # 01:00 Asia/Bangkok (UTC+7) — daily, feeds the 03:00 triage tick and
    # the 08:00 groom, so scouted issues enter the funnel the same morning.
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # manual "run now" button for testing

jobs:
  scout:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: read
      issues: write
    uses: YOUR-USERNAME/agent-ops/.github/workflows/scout-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      # max_issues: 3   # optional: cap issues filed per run
      # runner: blacksmith-2vcpu-ubuntu-2404  # optional: faster/cheaper runners (org repos only)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
