# Copy this file into each managed repo at .github/workflows/triage.yml
# Replace YOUR-USERNAME with your GitHub username/org.
#
# Requires:
#   - CLAUDE_CODE_OAUTH_TOKEN available to this repo (org secret, or repo secret)
#   - The agent-ops repo must allow workflow reuse:
#     agent-ops → Settings → Actions → General → Access →
#     "Accessible from repositories owned by <you>"

name: Hourly Agent Triage

on:
  schedule:
    # Start conservative: every 4 hours. Switch to '0 * * * *' (hourly)
    # once you trust the pipeline.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # manual "run now" button for testing

jobs:
  triage:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token, and repo defaults are
    # read-only (omitting this causes an opaque startup_failure).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # claude-code-action exchanges an OIDC token
      # Required by the auto-merge gate — unnamed scopes resolve to none,
      # so without these the pipeline gets 403 on check-runs and holds
      # every PR instead of merging. actions:read additionally lets it tell
      # "CI failed" apart from "CI never ran" (action_required).
      checks: read
      statuses: read
      actions: read
    uses: YOUR-USERNAME/agent-ops/.github/workflows/triage-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      max_issues: 3
      auto_merge: false   # report-only; flip to true after a trusted week
      # runner: blacksmith-2vcpu-ubuntu-2404  # optional: faster/cheaper runners (org repos only)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional (#53): lets the pipeline push as a GitHub App instead of
      # github-actions[bot], whose pushes produce workflow runs held on
      # manual approval — which blocks the auto-merge gate. Unset is fine;
      # the pipeline falls back to GITHUB_TOKEN.
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
