name: Agent · Review & Release

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  review-release:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: read
    uses: jirathip-k/agent-ops/.github/workflows/review-release.yml@v1
    with:
      model: opus
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
