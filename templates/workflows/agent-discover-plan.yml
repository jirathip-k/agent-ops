name: Agent · Discover & Plan

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  intake:
    if: >-
      github.event_name == 'issues' &&
      contains(
        fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.issue.author_association
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add issue to planning queue
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create "agent:needs-plan" \
            --repo "$TARGET_REPO" \
            --color "d4c5f9" \
            --description "Awaiting triage and a complete plan" \
            --force

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$TARGET_REPO" \
            --add-label "agent:needs-plan"

  discover-plan:
    if: github.event_name != 'issues'
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: jirathip-k/agent-ops/.github/workflows/discover-plan.yml@main
    with:
      model: fable
      max_items: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
