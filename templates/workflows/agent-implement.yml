name: Agent · Implement

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}

jobs:
  implement:
    permissions:
      contents: read
      issues: write
    uses: jirathip-k/agent-ops/.github/workflows/implement.yml@v1
    with:
      model: sonnet
      base_branch: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
