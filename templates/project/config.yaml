# Project-level agent-ops config. Merged over the platform defaults
# (agent-ops/config/defaults.yaml); values here win.

base_branch: main

commands:
  # These resolved strings are the sole executable contract for setup and
  # gates. agent-ops shows these exact spellings to planner/implementer/reviewer
  # agents, derives their permission allowlist from them, and runs them again
  # as the final gate authority. Adapt the repository here; do not rely on an
  # equivalent alias documented elsewhere.
  setup: null       # run once per fresh worktree, e.g. "npm install"
  test: null        # e.g. "uv run pytest -q" | "npm run test" | "swift test"
  lint: null        # e.g. "uv run ruff check ." | "npx eslint ."
  typecheck: null   # e.g. "uv run pyright" | "npx tsc --noEmit"
  # Executable names the gate commands above need on PATH. A run resolves each
  # one in the worktree after `setup` and aborts before doing any work if one
  # is missing, so the gap reads as an environment gap instead of failing a
  # gate an hour later. agent-ops only checks — installing stays `setup`'s job.
  #
  # List everything the gates need, NOT just what the package manager installs:
  # mirror every CI step that provisions a binary outside `setup` (hugo, protoc,
  # terraform, swiftlint, pandoc, imagemagick, a database binary). Left empty,
  # nothing is checked.
  requires: []      # e.g. [node, npm, hugo]

