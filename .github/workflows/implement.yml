name: Agent · Implement

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: sonnet
        type: string
      base_branch:
        description: Pull-request base branch
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: sonnet
        type: string
      base_branch:
        description: Pull-request base branch
        required: false
        default: main
        type: string
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_APP_ID:
        required: true
      AGENT_APP_PRIVATE_KEY:
        required: true

jobs:
  implement:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 55
    concurrency:
      group: agent-implement-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      # claude-code-action puts the workflow GITHUB_TOKEN in the agent's own
      # environment as DEFAULT_WORKFLOW_TOKEN, so this block — not the step's
      # env — is what bounds it. Only the label and selection steps use it, and
      # only for issues; branches, pushes, and pull requests use the App token.
      contents: read
      issues: write
    steps:
      - name: Ensure implementation labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:ready" --repo "$TARGET_REPO" --force \
            --color "1d76db" --description "Ready for unattended implementation"
          gh label create "agent:implementing" --repo "$TARGET_REPO" --force \
            --color "fbca04" --description "Claimed by the implementation lane"
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"

      - name: Select one ready issue
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          ISSUE=$(gh issue list --repo "$TARGET_REPO" --state open \
            --label "agent:ready" --search "-label:agent:implementing -label:agent:blocked" \
            --limit 100 --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // 0')
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Selected issue: $ISSUE"
          if [ "$ISSUE" != "0" ]; then
            echo "Selected issue: #$ISSUE" >> "$GITHUB_STEP_SUMMARY"
          else
            # An idle lane must stay green, so a transient API error here must
            # not fail the step; report an unknown count instead.
            READY=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "agent:ready" --limit 200 --json number --jq 'length' || echo "?")
            IMPLEMENTING=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "agent:implementing" --limit 200 --json number --jq 'length' || echo "?")
            BLOCKED=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "agent:blocked" --limit 200 --json number --jq 'length' || echo "?")
            NEEDS_PLAN=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "agent:needs-plan" --limit 200 --json number --jq 'length' || echo "?")
            {
              echo "No issue was selectable."
              echo ""
              echo "- agent:ready: $READY"
              echo "- agent:implementing: $IMPLEMENTING"
              echo "- agent:blocked: $BLOCKED"
              echo "- agent:needs-plan: $NEEDS_PLAN"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint a target-scoped GitHub App token
        id: app_token
        if: steps.select.outputs.issue != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The action accepts the numeric App ID or the App's Client ID here;
          # both are valid GitHub App JWT issuers, so AGENT_APP_ID is unchanged.
          client-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Mint a read-only token for the agent
        id: agent_token
        if: steps.select.outputs.issue != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-metadata: read

      - name: Checkout target repository
        if: steps.select.outputs.issue != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Checkout agent prompts
        if: steps.select.outputs.issue != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          # Pair control-repository workflows with their prompt commit; target
          # repositories consume both halves at v1.
          ref: ${{ github.repository == 'jirathip-k/agent-ops' && github.sha || 'v1' }}
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        if: steps.select.outputs.issue != '0'
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Claim the issue
        id: claim
        if: steps.select.outputs.issue != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # The label is the claim: fail closed on exhaustion, because an issue
          # left unclaimed here could be re-selected by a concurrent or
          # subsequent run.
          CLAIM_LABEL_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue edit "$ISSUE" --repo "$TARGET_REPO" --add-label "agent:implementing"; then
              CLAIM_LABEL_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done
          if [ "$CLAIM_LABEL_OK" != "true" ]; then
            echo "::error::Could not add agent:implementing to issue $ISSUE after retries."
            exit 1
          fi

          # The comment is provenance only, not the claim: the label above already
          # landed, so failing the step here would discard a claim that already
          # succeeded and park a healthy issue as blocked. Warn and continue
          # instead of exiting non-zero.
          COMMENT_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue comment "$ISSUE" --repo "$TARGET_REPO" \
              --body "Implementation started in workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."; then
              COMMENT_OK=true
              break
            fi
            # Guarded, unlike the label loop above: that one is allowed to abort
            # the step, this one is not. agent:implementing has already landed
            # by here, so exiting non-zero would park a healthy, claimed issue
            # as blocked over a comment that is only provenance.
            sleep "$ATTEMPT" ||
              echo "::warning::Interrupted while waiting to retry the claim comment on issue $ISSUE."
          done
          if [ "$COMMENT_OK" != "true" ]; then
            echo "::warning::Could not comment on issue $ISSUE after retries; continuing."
          fi

      - name: Fetch the selected issue
        if: steps.select.outputs.issue != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_FILE: ${{ runner.temp }}/agent-issue.md
        run: |
          # Admit only comments from people with write access to the repository,
          # plus github-actions, which is the identity the planning lane comments
          # as. On a public repository anyone can comment on an issue that is
          # already agent:ready, so an unfiltered read would hand the untrusted
          # input surface to the whole internet. Bound the volume too: CI
          # reporters post as github-actions and can be thousands of lines.
          #
          # Write to a scratch file and only move it onto ISSUE_FILE once an
          # attempt succeeds: `cmd > "$ISSUE_FILE"` truncates the destination
          # before cmd runs, so retrying straight into ISSUE_FILE would leave a
          # truncated file behind after a failed attempt, for either a later
          # attempt or the implementation step to read.
          FETCH_TMP=$(mktemp)
          FETCH_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue view "$ISSUE" --repo "$TARGET_REPO" --json title,body,comments \
              --jq '[ "# " + .title, (.body // "") ]
                    + ( [ .comments[]
                          | select(.authorAssociation == "OWNER"
                                or .authorAssociation == "MEMBER"
                                or .authorAssociation == "COLLABORATOR"
                                or .author.login == "github-actions") ]
                        | .[-5:]
                        | map("---\n\n### Comment by " + (.author.login // "unknown")
                              + "\n\n" + ((.body // "")[:4000])) )
                    | join("\n\n")' > "$FETCH_TMP"; then
              FETCH_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done
          if [ "$FETCH_OK" != "true" ]; then
            rm -f "$FETCH_TMP"
            echo "::error::Could not fetch issue $ISSUE after retries."
            exit 1
          fi
          mv "$FETCH_TMP" "$ISSUE_FILE"

      - name: Implement the selected issue
        id: claude
        if: steps.select.outputs.issue != '0'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.agent_token.outputs.token }}
          base_branch: ${{ inputs.base_branch || 'main' }}
          branch_prefix: agent/issue-${{ steps.select.outputs.issue }}-
          prompt: |
            REPOSITORY: ${{ github.repository }}
            ISSUE_NUMBER: ${{ steps.select.outputs.issue }}
            ISSUE_FILE: ${{ runner.temp }}/agent-issue.md

            Follow .agent-ops-control/prompts/implement.md exactly.
            Read the issue from the file at ISSUE_FILE.
            Work in the checked-out repository root.
          claude_args: >-
            --model ${{ inputs.model || 'sonnet' }}
            --max-turns 45
            --setting-sources user
            --allowedTools
            "Read,Edit,Write,Grep,Glob,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(make:*),Bash(mise:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(bun:*),Bash(uv:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(cargo:*),Bash(go:*),Bash(dotnet:*),Bash(mvn:*),Bash(gradle:*),Bash(swift:*),Bash(xcodebuild:*)"

      - name: Stage implementation changes
        id: stage
        if: steps.select.outputs.issue != '0'
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          ISSUE: ${{ steps.select.outputs.issue }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Fail closed: a missing base ref would make the comparisons below find
          # nothing and misreport the run as having changed nothing.
          git rev-parse --verify --quiet "origin/$BASE_BRANCH" > /dev/null

          # A project command Claude is allowed to run may commit on its own, leaving a
          # clean tree with the work already on HEAD. Only the absence of both is
          # "changed nothing".
          AHEAD=$(git rev-list --count "origin/$BASE_BRANCH..HEAD")
          if [ -z "$(git status --porcelain)" ] && [ "$AHEAD" -eq 0 ]; then
            echo "::error::Claude changed nothing."
            exit 1
          fi
          BRANCH="agent/issue-$ISSUE-$RUN_ID-$RUN_ATTEMPT"
          git switch -c "$BRANCH"
          git config user.name "agent-ops[bot]"
          git config user.email "agent-ops[bot]@users.noreply.github.com"
          git add --all
          # Inspect both what will be committed and anything a project command
          # committed on its own; either path would otherwise reach the remote.
          # Read NUL-delimited and match per record: `git diff --name-only`
          # C-quotes any path with a non-ASCII byte, quote, backslash, or
          # newline, which defeats a `^`-anchored match on its plain output.
          # Collect to a temp file instead of `< <(...)`: process substitution
          # discards the exit status of the commands feeding it, so under this
          # step's `bash -e` a failing `git diff` (e.g. no merge base) would go
          # unnoticed and the loop below would just read fewer records.
          PATHS=$(mktemp)
          { git diff --cached --no-renames --name-only -z;
            git diff --no-renames --name-only -z "origin/$BASE_BRANCH...HEAD"; } > "$PATHS"
          STAGED=()
          CONTROL_HIT=0
          while IFS= read -r -d '' path; do
            STAGED+=("$path")
            # Match the directory itself too: `git add -f .agent-ops-control`
            # records a gitlink with no trailing slash, which a `/`-anchored
            # pattern misses. Match with `case`, not `[[ =~ ]]`: a raw
            # invalid-UTF-8 byte in path can make the regex engine fail the
            # whole match (not just not-match) under a UTF-8 locale on some
            # libc implementations, which would fail this guard open.
            case "$path" in
              .agent-ops-control | .agent-ops-control/*) CONTROL_HIT=1 ;;
            esac
          done < "$PATHS"
          if [ "$CONTROL_HIT" -eq 1 ]; then
            echo "::error::Control-repository files were staged; refusing to publish."
            exit 1
          fi
          echo "Staged for publication:"
          printf '%s\n' "${STAGED[@]}" | LC_ALL=C sort -u
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Reject workflow and action changes
        if: steps.select.outputs.issue != '0'
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
        run: |
          # Fail closed: if the base ref is missing the comparison below would
          # silently find nothing, so verify it before trusting the result.
          git rev-parse --verify --quiet "origin/$BASE_BRANCH" > /dev/null

          IS_CONTROL_REPO=0
          REJECTION_MESSAGE='The implementation lane may not modify GitHub workflows or actions.'
          if [ "$GITHUB_REPOSITORY" = 'jirathip-k/agent-ops' ]; then
            IS_CONTROL_REPO=1
            REJECTION_MESSAGE='The implementation lane may not modify GitHub workflows, actions, prompts, or templates in the control repository.'
          fi

          # Inspect both what will be committed and anything a project command
          # committed on its own; either path would otherwise reach the remote.
          # Read NUL-delimited and match per record: `git diff --name-only`
          # C-quotes any path with a non-ASCII byte, quote, backslash, or
          # newline, which defeats a `^`-anchored match on its plain output.
          # Collect to a temp file instead of `< <(...)`: process substitution
          # discards the exit status of the commands feeding it, so under this
          # step's `bash -e` a failing `git diff` (e.g. no merge base) would go
          # unnoticed and the loop below would just read fewer records.
          PATHS=$(mktemp)
          { git diff --cached --no-renames --name-only -z;
            git diff --no-renames --name-only -z "origin/$BASE_BRANCH...HEAD"; } > "$PATHS"
          REJECTED=()
          while IFS= read -r -d '' path; do
            # Match with `case`, not `[[ =~ ]]`: a raw invalid-UTF-8 byte in
            # path can make the regex engine fail the whole match (not just
            # not-match) under a UTF-8 locale on some libc implementations,
            # which would fail this guard open.
            case "$path" in
              .github/workflows | .github/workflows/* | .github/actions | .github/actions/*)
                REJECTED+=("$path") ;;
              prompts | prompts/* | templates | templates/*)
                if [ "$IS_CONTROL_REPO" -eq 1 ]; then REJECTED+=("$path"); fi ;;
            esac
          done < "$PATHS"
          if [ "${#REJECTED[@]}" -gt 0 ]; then
            echo "::error::$REJECTION_MESSAGE"
            printf '%s\n' "${REJECTED[@]}"
            exit 1
          fi

      - name: Publish implementation branch
        id: publish
        if: steps.select.outputs.issue != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.stage.outputs.branch }}
          ISSUE: ${{ steps.select.outputs.issue }}
        run: |
          # Target repositories may install commit hooks as a side effect of the
          # validation commands Claude is asked to run; they must not gate the lane.
          # The stage step admits work a project command already committed, in which
          # case HEAD carries it and the index is empty.
          if git diff --cached --quiet; then
            echo "Nothing staged; HEAD already carries the implementation."
          else
            git commit --no-verify -m "agent: implement issue #$ISSUE"
          fi
          # claude-code-action rewrote the remote to carry the read-only agent
          # token. Drop it, then push with an explicit write credential that is
          # never written to git configuration.
          git remote set-url origin "$GITHUB_SERVER_URL/$TARGET_REPO.git"
          git push "https://x-access-token:$GH_TOKEN@${GITHUB_SERVER_URL#http*://}/$TARGET_REPO.git" \
            "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open a draft pull request
        id: pull_request
        if: steps.select.outputs.issue != '0'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          ISSUE: ${{ steps.select.outputs.issue }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_FILE: ${{ runner.temp }}/agent-issue.md
        run: |
          if [ -z "$BRANCH" ]; then
            echo "::error::Claude produced no branch."
            exit 1
          fi
          # Read the title from the file Fetch the selected issue already wrote,
          # instead of a fresh gh issue view call: that step's --jq program begins
          # `[ "# " + .title, ... ]`, so line 1 of ISSUE_FILE is always "# <title>",
          # and runner.temp survives every step in this job. Re-fetching would only
          # add API load and a new failure point for information already on disk.
          if [ ! -f "$ISSUE_FILE" ]; then
            echo "::error::$ISSUE_FILE is missing; the fetch step did not write it."
            exit 1
          fi
          TITLE=$(head -n 1 "$ISSUE_FILE")
          # Strip exactly the "# " the fetch step prepended, and nothing more: an
          # issue title may legitimately start with a literal '#'.
          TITLE=${TITLE#"# "}
          if [ -z "$TITLE" ]; then
            echo "::error::Could not read a pull-request title from $ISSUE_FILE."
            exit 1
          fi
          BODY=$(printf 'Closes #%s\n\nCreated by the subscription-backed implementation lane. Human review and merge are required.' "$ISSUE")
          URL=$(gh pr create --repo "$TARGET_REPO" --head "$BRANCH" --base "$BASE_BRANCH" \
            --draft --title "$TITLE" --body "$BODY")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # These three API calls are not atomic, so retry the transitions that
          # could otherwise strand a pull request where no lane can see it.
          PR_LABEL_OK=false
          for ATTEMPT in 1 2 3; do
            if gh pr edit "$URL" --repo "$TARGET_REPO" --add-label "agent:review"; then
              PR_LABEL_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done
          if [ "$PR_LABEL_OK" != "true" ]; then
            echo "::error::Could not add agent:review to pull request $URL after retries."
            exit 1
          fi

          ISSUE_LABELS_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue edit "$ISSUE" --repo "$TARGET_REPO" \
              --remove-label "agent:ready" --remove-label "agent:implementing"; then
              ISSUE_LABELS_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done
          if [ "$ISSUE_LABELS_OK" != "true" ]; then
            echo "::error::Could not remove implementation queue labels from issue $ISSUE after retries."
            exit 1
          fi
          echo "Opened draft PR: $URL"

      - name: Mark failed work as blocked
        if: >-
          always() && (failure() || cancelled()) &&
          steps.select.outputs.issue != '0' &&
          steps.app_token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE: ${{ steps.select.outputs.issue }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # Open a draft pull request can create the pull request server-side and
          # then fail before recording its URL (a 502 or client-side timeout right
          # after `gh pr create`, or the step being cancelled between the create
          # and the echo). PR_URL is then empty even though a pull request exists,
          # which would otherwise take the no-pull-request branch below and post
          # the exact human-caused duplicate-requeue instruction #377 closed. Look
          # the pull request up by branch first. This is best-effort only: this
          # step runs during failure handling under continue-on-error, so the
          # lookup is guarded end to end and must never trip set -e.
          if [ -z "$PR_URL" ] && [ -n "$BRANCH" ]; then
            # --head filters on the head ref NAME only, so it also matches pull
            # requests opened from forks. The branch name is derived from the
            # issue number, run id and attempt, all public the moment the job
            # starts, so on a public repository anyone could open a fork pull
            # request on that exact name in advance. Results come back newest
            # first, so an unfiltered .[0] would hand agent:review — the review
            # lane's only selection key — to a stranger's pull request and point
            # the human at it, while the lane's own stayed stranded. Admit only
            # a branch in this repository.
            FOUND_URL=$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open \
              --json url,isCrossRepository \
              --jq 'map(select(.isCrossRepository == false)) | .[0].url // ""' \
              || echo "")
            if [ -n "$FOUND_URL" ]; then
              PR_URL="$FOUND_URL"
            fi
          fi
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --repo "$TARGET_REPO" \
              --add-label "agent:review" ||
              echo "::warning::Could not add agent:review to pull request $PR_URL."
          fi
          # gh issue edit applies adds and removes concurrently, so a combined
          # call can strip every lifecycle label. Add the replacement first and
          # only remove the old labels after the add succeeds.
          BLOCKED_LABEL_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue edit "$ISSUE" --repo "$TARGET_REPO" \
              --add-label "agent:blocked"; then
              BLOCKED_LABEL_OK=true
              break
            fi
            # The other retry loops in this file sleep unguarded because they
            # are allowed to abort their step. This one is not: an interrupted
            # sleep must not trip set -e and skip the comment below, which is
            # the only thing that tells a human what happened.
            sleep "$ATTEMPT" ||
              echo "::warning::Interrupted while waiting to retry agent:blocked on issue $ISSUE."
          done
          if [ "$BLOCKED_LABEL_OK" = "true" ]; then
            gh issue edit "$ISSUE" --repo "$TARGET_REPO" \
              --remove-label "agent:implementing" --remove-label "agent:ready" ||
              echo "::warning::Could not remove implementation queue labels from issue $ISSUE."
          else
            echo "::warning::Could not add agent:blocked to issue $ISSUE after retries; keeping its existing labels."
          fi
          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE" --repo "$TARGET_REPO" \
              --body "Implementation stopped after draft pull request $PR_URL was created. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Requeuing would open a second pull request. Review or close $PR_URL instead. If it is missing agent:review, add that label to return it to the review queue."
          elif [ "$BLOCKED_LABEL_OK" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$TARGET_REPO" \
              --body "Implementation stopped. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. To requeue, remove agent:blocked and add agent:ready."
          else
            # agent:blocked never landed, so the usual requeue instruction
            # names a label that is not there and leaves the one that is.
            gh issue comment "$ISSUE" --repo "$TARGET_REPO" \
              --body "Implementation stopped, and this issue could not be labelled agent:blocked. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. It still carries agent:implementing, which keeps it out of the queue: remove that label to requeue it."
          fi
