name: Agent · Discover & Plan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  discover-plan:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: agent-discover-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agent prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          ref: v1
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Ensure lifecycle labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:needs-plan" --repo "$TARGET_REPO" --force \
            --color "d4c5f9" --description "Awaiting triage and a complete plan"
          gh label create "agent:ready" --repo "$TARGET_REPO" --force \
            --color "1d76db" --description "Ready for unattended implementation"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"
          gh label create "agent:implementing" --repo "$TARGET_REPO" --force \
            --color "fbca04" --description "Claimed by the implementation lane"
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:approved" --repo "$TARGET_REPO" --force \
            --color "2cbe4e" --description "Agent review passed; human merge required"

      - name: Discover and plan
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            MAX_ITEMS: ${{ inputs.max_items || 3 }}

            Follow .agent-ops-control/prompts/discover-plan.md exactly.
            Work in the checked-out repository root.
          claude_args: >-
            --model ${{ inputs.model || 'fable' }}
            --max-turns 30
            --allowedTools
            "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(gh issue:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(gh run view:*)"

      - name: Print Claude execution result
        if: failure() || cancelled()
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          log_path="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [[ ! -f "$log_path" ]]; then
            echo "Claude execution log not found at $log_path"
            exit 0
          fi

          echo "Final Claude execution result:"
          jq -s '[.[] | if type == "array" then .[] else . end | select(.type == "result")] | last' "$log_path"

      - name: Report queue health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # agent:review, agent:approved, and agent:changes-requested are only
          # ever applied to pull requests, and `gh issue list` excludes those —
          # counting them as issues would report 0 forever.
          issue_labels=(
            "agent:needs-plan"
            "agent:ready"
            "agent:implementing"
            "agent:blocked"
          )
          pr_labels=(
            "agent:review"
            "agent:approved"
            "agent:changes-requested"
          )

          {
            echo "## Agent queue health"
            echo
            echo "| Lifecycle label | Scope | Open |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          ready_count=0
          blocked_count=0
          for label in "${issue_labels[@]}"; do
            count=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "$label" --json number --jq 'length' || echo "?")
            echo "| \`$label\` | issues | $count |" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$label" == "agent:ready" ]]; then
              ready_count=$count
            elif [[ "$label" == "agent:blocked" ]]; then
              blocked_count=$count
            fi
          done

          for label in "${pr_labels[@]}"; do
            count=$(gh pr list --repo "$TARGET_REPO" --state open \
              --label "$label" --json number --jq 'length' || echo "?")
            echo "| \`$label\` | pull requests | $count |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [[ "$ready_count" =~ ^[0-9]+$ && "$blocked_count" =~ ^[0-9]+$ ]] &&
             (( ready_count == 0 && blocked_count > 0 )); then
            {
              echo
              echo "> [!WARNING]"
              echo "> Queue cannot drain: no issues are ready and $blocked_count are blocked."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
