name: Agent · Discover & Plan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  discover-plan:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: agent-discover-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agent prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          # Pair control-repository workflows with their prompt commit; target
          # repositories consume both halves at v1.
          ref: ${{ github.repository == 'jirathip-k/agent-ops' && github.sha || 'v1' }}
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Ensure lifecycle labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:needs-plan" --repo "$TARGET_REPO" --force \
            --color "d4c5f9" --description "Awaiting triage and a complete plan"
          gh label create "agent:ready" --repo "$TARGET_REPO" --force \
            --color "1d76db" --description "Ready for unattended implementation"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"
          gh label create "agent:implementing" --repo "$TARGET_REPO" --force \
            --color "fbca04" --description "Claimed by the implementation lane"
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:approved" --repo "$TARGET_REPO" --force \
            --color "2cbe4e" --description "Agent review passed; human merge required"

      - name: Discover and plan
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            MAX_ITEMS: ${{ inputs.max_items || 3 }}

            Follow .agent-ops-control/prompts/discover-plan.md exactly.
            Work in the checked-out repository root.
          claude_args: >-
            --model ${{ inputs.model || 'fable' }}
            --max-turns 30
            --setting-sources user
            --json-schema
            '{"type":"object","additionalProperties":false,"required":["transitions"],"properties":{"transitions":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["issue","add","remove"],"properties":{"issue":{"type":"integer"},"add":{"type":"array","items":{"type":"string","enum":["agent:needs-plan","agent:ready","agent:blocked"]}},"remove":{"type":"array","items":{"type":"string","enum":["agent:needs-plan","agent:ready","agent:blocked"]}}}}}}}'
            --allowedTools
            "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(gh run view:*)"

      - name: Apply label transitions
        id: transitions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          # Label transitions are the model's structured output, not a tool
          # call, and that output is untrusted data: it is validated against
          # live issue state and a fixed label vocabulary before anything is
          # written. #370 dropped Bash(gh issue edit:*) from the lane's
          # allowlist for exactly this reason — this step is now the only
          # place a lifecycle label changes on an existing issue.
          #
          # An empty STRUCTURED_OUTPUT means --json-schema never produced a
          # conforming terminating call — most likely --max-turns exhausted
          # first (see #374, which cost five hours of reddened idle runs to
          # the same failure mode). That must fail loudly, not apply nothing
          # and pass as a quiet idle run.
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::Discover and plan produced no structured output; no label transitions could be validated."
            exit 1
          fi

          OUTPUT_FILE=$(mktemp)
          printf '%s' "$STRUCTURED_OUTPUT" > "$OUTPUT_FILE"

          # A bare `// []` default here would turn a missing or renamed
          # `transitions` key into "zero transitions" — indistinguishable
          # from a genuine idle run — so an object missing the required key
          # entirely must fail this check, not fall through it.
          if ! jq -e 'type == "object" and has("transitions") and (.transitions | type == "array")' "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "::error::Discover and plan's structured output did not conform to the expected schema."
            exit 1
          fi

          TRANSITIONS_FILE=$(mktemp)
          jq -c '.transitions | .[]' "$OUTPUT_FILE" > "$TRANSITIONS_FILE"

          {
            echo "## Label transitions"
            echo
            echo "| Issue | Outcome |"
            echo "| ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          APPLIED=0
          REJECTED=0
          FAILED=0

          while IFS= read -r TRANSITION; do
            [ -z "$TRANSITION" ] && continue

            # Only a digit string is ever interpolated into a gh command or
            # printed below; a non-numeric value is rejected before it
            # touches anything else.
            ISSUE=$(printf '%s' "$TRANSITION" | jq -r '.issue // empty')
            if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
              echo "::warning::Discover and plan proposed a transition with a non-numeric issue number; rejected."
              echo "| ? | rejected: non-numeric issue number |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # A transient read failure here must not silently drop a proposed
            # transition; retry before rejecting it as unvalidatable.
            CURRENT=""
            CURRENT_OK=false
            for ATTEMPT in 1 2 3; do
              if CURRENT=$(gh issue view "$ISSUE" --repo "$TARGET_REPO" --json state,labels,author); then
                CURRENT_OK=true
                break
              fi
              sleep "$ATTEMPT"
            done

            if [ "$CURRENT_OK" != "true" ]; then
              echo "::warning::Could not read live state for issue $ISSUE after retries; its proposed transition was rejected."
              echo "| #$ISSUE | rejected: could not read live issue state |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # implement.yml's "Open a draft pull request" removes both
            # agent:ready and agent:implementing the instant a draft PR
            # opens, so an in-flight issue can be OPEN with no lifecycle
            # label at all and still clear every check above. gh issue view
            # exposes no linked-PR field, so search PRs for the literal
            # `Closes #<n>` body implement.yml writes when it opens one, the
            # same way this transient-failure guard treats any other live
            # read: retry before rejecting the transition as unvalidatable.
            OPEN_PR_COUNT=""
            OPEN_PR_OK=false
            for ATTEMPT in 1 2 3; do
              if OPEN_PR_COUNT=$(gh pr list --repo "$TARGET_REPO" --state open \
                  --search "$ISSUE in:body" --json number --jq 'length'); then
                OPEN_PR_OK=true
                break
              fi
              sleep "$ATTEMPT"
            done

            if [ "$OPEN_PR_OK" != "true" ]; then
              echo "::warning::Could not check issue $ISSUE for an open pull request after retries; its proposed transition was rejected."
              echo "| #$ISSUE | rejected: could not check for an open pull request |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # Every invariant lives in jq, never in bash string comparisons,
            # so an add/remove value that somehow escaped the schema's enum
            # is only ever compared inside jq and is never interpolated into
            # a command or echoed unfenced.
            REASON=$(jq -nr \
              --argjson t "$TRANSITION" \
              --argjson cur "$CURRENT" \
              --argjson known '["agent:needs-plan","agent:ready","agent:blocked"]' \
              --argjson open_pr_count "$OPEN_PR_COUNT" \
              --arg lane_author "app/github-actions" \
              '
              ($t.add // []) as $add
              | ($t.remove // []) as $remove
              | ($cur.labels | map(.name)) as $current
              | if (($add + $remove) | any(. as $l | ($known | index($l)) == null)) then
                  "unknown label"
                elif ($add | any(. as $l | ($remove | index($l)) != null)) then
                  "same label in add and remove"
                elif ($cur.state != "OPEN") then
                  "issue is not open"
                elif (($current | index("agent:implementing")) != null) then
                  "issue is agent:implementing"
                elif (($current | index("agent:review")) != null) then
                  "issue is agent:review"
                elif ($open_pr_count > 0) then
                  "issue has an open pull request"
                elif ((($current - $remove) + $add) as $result
                      | (($result | index("agent:needs-plan")) != null)
                        and (($result | index("agent:ready")) != null)) then
                  "would leave agent:needs-plan and agent:ready both set"
                elif ((($add | index("agent:needs-plan")) != null)
                      and ($cur.author.login != $lane_author)) then
                  "agent:needs-plan may only be added to an issue this lane created"
                else
                  "ok"
                end
              ')

            if [ "$REASON" != "ok" ]; then
              echo "::warning::Issue $ISSUE: transition rejected ($REASON)."
              echo "| #$ISSUE | rejected: $REASON |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # A temp file, not `< <(process substitution)`: substitution
            # discards the feeding pipeline's exit status, so a failing jq
            # here would go unnoticed under this step's implicit `bash -e`
            # and silently yield an empty label list instead of a hard stop.
            ADD_FILE=$(mktemp)
            printf '%s' "$TRANSITION" | jq -r '.add // [] | .[]' > "$ADD_FILE"
            ADD_ARGS=()
            while IFS= read -r LABEL; do
              [ -z "$LABEL" ] && continue
              ADD_ARGS+=(--add-label "$LABEL")
            done < "$ADD_FILE"

            REMOVE_FILE=$(mktemp)
            printf '%s' "$TRANSITION" | jq -r '.remove // [] | .[]' > "$REMOVE_FILE"
            REMOVE_ARGS=()
            while IFS= read -r LABEL; do
              [ -z "$LABEL" ] && continue
              REMOVE_ARGS+=(--remove-label "$LABEL")
            done < "$REMOVE_FILE"

            # gh issue edit applies adds and removes concurrently (see the
            # same note in implement.yml's "Mark failed work as blocked"),
            # so a combined call that fails partway can strip more labels
            # than intended. Apply the addition first: a failure after that
            # point leaves the issue with an extra label, never with none.
            APPLY_OK=true
            if [ "${#ADD_ARGS[@]}" -gt 0 ]; then
              ADD_DONE=false
              for ATTEMPT in 1 2 3; do
                if gh issue edit "$ISSUE" --repo "$TARGET_REPO" "${ADD_ARGS[@]}"; then
                  ADD_DONE=true
                  break
                fi
                sleep "$ATTEMPT"
              done
              [ "$ADD_DONE" = "true" ] || APPLY_OK=false
            fi

            if [ "$APPLY_OK" = "true" ] && [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
              REMOVE_DONE=false
              for ATTEMPT in 1 2 3; do
                if gh issue edit "$ISSUE" --repo "$TARGET_REPO" "${REMOVE_ARGS[@]}"; then
                  REMOVE_DONE=true
                  break
                fi
                sleep "$ATTEMPT"
              done
              [ "$REMOVE_DONE" = "true" ] || APPLY_OK=false
            fi

            if [ "$APPLY_OK" = "true" ]; then
              echo "Applied transition for issue $ISSUE."
              echo "| #$ISSUE | applied |" >> "$GITHUB_STEP_SUMMARY"
              APPLIED=$((APPLIED + 1))
            else
              # This is not a rejection: a validated transition had at least
              # one gh issue edit call fail after retries, which can leave
              # the issue in a half-applied state (e.g. agent:ready added,
              # agent:needs-plan not removed) — the exact double-labelled
              # shape #400 and #404 were filed over. Counting it as
              # "rejected" would read as "nothing was written" when
              # something was. Track it separately and fail the step below,
              # matching the fail-closed posture implement.yml:465 and
              # review-release.yml:370 already use for a failed label write.
              echo "::error::Issue $ISSUE: a validated transition could not be fully applied after retries; it may now carry a partially-applied label change."
              echo "| #$ISSUE | failed: partially applied after retries |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED + 1))
            fi
          done < "$TRANSITIONS_FILE"

          echo "Applied: $APPLIED, rejected: $REJECTED, failed: $FAILED." >> "$GITHUB_STEP_SUMMARY"

          # Fail after every transition has had its attempt and the summary
          # is fully written, not inside the loop: best-effort per item stays
          # intact, and the run still ends non-green so a human is pointed at
          # the specific issue(s) above that may need a manual label fix.
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Print Claude execution result
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          log_path="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [[ ! -f "$log_path" ]]; then
            echo "Claude execution log not found at $log_path"
            exit 0
          fi

          echo "Final Claude execution result:"
          jq -s '[.[] | if type == "array" then .[] else . end | select(.type == "result")] | last' "$log_path"

      - name: Report queue health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # agent:review, agent:approved, and agent:changes-requested are only
          # ever applied to pull requests, and `gh issue list` excludes those —
          # counting them as issues would report 0 forever. agent:blocked is
          # the one lifecycle label applied to both kinds of work — `Mark
          # failed work as blocked` in implement.yml labels issues, `Mark
          # failed review as blocked` in review-release.yml labels pull
          # requests — so it appears in both lists below and gets a row for
          # each scope.
          issue_labels=(
            "agent:needs-plan"
            "agent:ready"
            "agent:implementing"
            "agent:blocked"
          )
          pr_labels=(
            "agent:review"
            "agent:approved"
            "agent:changes-requested"
            "agent:blocked"
          )

          {
            echo "## Agent queue health"
            echo
            echo "| Lifecycle label | Scope | Open |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          blocked_count=0
          for label in "${issue_labels[@]}"; do
            count=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "$label" --limit 200 --json number --jq 'length' || echo "?")
            echo "| \`$label\` | issues | $count |" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$label" == "agent:blocked" ]]; then
              blocked_count=$count
            fi
          done

          for label in "${pr_labels[@]}"; do
            count=$(gh pr list --repo "$TARGET_REPO" --state open \
              --label "$label" --limit 200 --json number --jq 'length' || echo "?")
            echo "| \`$label\` | pull requests | $count |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Orphan branches: a runner that dies mid-implementation (VM loss,
          # force-cancel, infrastructure kill) after "Stage implementation
          # changes" pushes a branch but never reaches "Open a draft pull
          # request" — no in-run handler executes for that, `Mark failed work
          # as blocked` only runs under failure()/cancelled(), which a runner
          # loss does not reach either. No lane inspects branches, so that
          # branch and its stuck agent:implementing issue are invisible
          # everywhere. This block makes them visible only; nothing here
          # comments, relabels, closes, or deletes anything.
          #
          # implement.yml's "Stage implementation changes" names every branch
          # it pushes agent/issue-$ISSUE-$RUN_ID-$RUN_ATTEMPT (implement.yml
          # around line 341), so the linked issue number is recoverable
          # straight from the branch name — no need to search pull request
          # bodies for a "Closes #N" match the way "Apply label transitions"
          # above has to.
          #
          # The rule: a branch counts as orphaned when it has no OPEN pull
          # request AND its linked issue is still OPEN. "No open PR" alone is
          # not enough — every ordinary branch reaches that state the moment
          # its PR merges or is closed, which is the common case, not an
          # orphan. Gating on the issue also being open is what keeps those
          # post-merge branches from inflating this count into permanent
          # noise: a merge normally closes the linked issue via the "Closes
          # #N" the PR body carries, so a merged/closed-PR branch whose issue
          # is already closed is expected and excluded. The remaining two
          # shapes are both genuinely stuck and both counted: a branch with no
          # PR at all (the runner-death case above) and a branch whose PR was
          # merged or closed without the issue closing (a reopen, a "Closes
          # #N" that didn't fire, or a closed-without-merging PR that
          # abandoned the work) — either way a human needs to look.
          #
          # Both queries below are scoped by repository (`gh api
          # repos/$TARGET_REPO/branches`, `gh api repos/$TARGET_REPO/pulls`),
          # never by workflow file path, so this is exactly as correct in an
          # onboarded target repository as it is here — unlike the file-path
          # workflow lookup #430 had to replace with a display-name lookup
          # earlier in this same step, there is no reusable-vs-caller split
          # to trip over: branches and pull requests belong to the repository
          # itself, not to whichever workflow file happens to run in it.
          # Both are fully paginated with --paginate rather than a fixed
          # --limit: branches are already enumerated exhaustively, and capping
          # the open-pull-request side at a fixed limit would silently drop
          # head refs past the cap in a busy repo, misreporting genuinely
          # in-flight branches as orphans — an over-count, which is exactly
          # the kind of noise this row exists to avoid.
          orphan_count=0
          branches_ok=false
          branches_file=$(mktemp)
          for ATTEMPT in 1 2 3; do
            if gh api "repos/$TARGET_REPO/branches" --paginate \
                --jq '.[].name' > "$branches_file"; then
              branches_ok=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$branches_ok" != "true" ]; then
            orphan_count="?"
          else
            agent_branches_file=$(mktemp)
            grep '^agent/issue-' "$branches_file" > "$agent_branches_file" || true

            open_pr_heads_ok=false
            open_pr_heads_file=$(mktemp)
            for ATTEMPT in 1 2 3; do
              if gh api "repos/$TARGET_REPO/pulls" --paginate \
                  -f state=open -f per_page=100 \
                  --jq '.[].head.ref' > "$open_pr_heads_file"; then
                open_pr_heads_ok=true
                break
              fi
              sleep "$ATTEMPT"
            done

            if [ "$open_pr_heads_ok" != "true" ]; then
              orphan_count="?"
            else
              while IFS= read -r BRANCH; do
                [ -z "$BRANCH" ] && continue
                grep -qxF "$BRANCH" "$open_pr_heads_file" && continue

                if [[ "$BRANCH" =~ ^agent/issue-([0-9]+)- ]]; then
                  ISSUE="${BASH_REMATCH[1]}"
                else
                  echo "::warning::Branch $BRANCH matches agent/issue-* but no issue number could be parsed from it; skipped."
                  continue
                fi

                # A deleted or renumbered issue is a permanent condition, not
                # the transient class the retry loop below exists for: `gh
                # issue view` fails immediately with "Could not resolve to an
                # issue" and would otherwise burn three retries every run,
                # forever, for a branch that can never resolve. Detected and
                # skipped without retrying, the same way the workflow lookup
                # further below distinguishes "not found" from "transient".
                #
                # A transient failure, in contrast, is per-item like the
                # sibling read in "Apply label transitions" above (:183): it
                # skips only this one branch rather than aborting the whole
                # orphan count to "?", so one bad branch cannot blind the row
                # to every other orphan that round.
                issue_state_ok=false
                issue_state=""
                issue_not_found=false
                for ATTEMPT in 1 2 3; do
                  ISSUE_VIEW_ERR=$(mktemp)
                  if issue_state=$(gh issue view "$ISSUE" --repo "$TARGET_REPO" \
                      --json state --jq '.state' 2>"$ISSUE_VIEW_ERR"); then
                    issue_state_ok=true
                    rm -f "$ISSUE_VIEW_ERR"
                    break
                  fi
                  if grep -q "Could not resolve to an issue" "$ISSUE_VIEW_ERR"; then
                    issue_not_found=true
                    rm -f "$ISSUE_VIEW_ERR"
                    break
                  fi
                  rm -f "$ISSUE_VIEW_ERR"
                  sleep "$ATTEMPT"
                done

                if [ "$issue_not_found" = "true" ]; then
                  echo "::warning::Branch $BRANCH names issue $ISSUE, which no longer exists; skipped."
                  continue
                fi

                if [ "$issue_state_ok" != "true" ]; then
                  echo "::warning::Could not read live state for issue $ISSUE after retries; branch $BRANCH's orphan status is unknown this run."
                  continue
                fi

                if [ "$issue_state" = "OPEN" ]; then
                  orphan_count=$((orphan_count + 1))
                fi
              done < "$agent_branches_file"
            fi
          fi

          if ! [[ "$orphan_count" =~ ^[0-9]+$ ]]; then
            orphan_count="?"
          fi
          echo "| \`(orphaned)\` | branches | $orphan_count |" >> "$GITHUB_STEP_SUMMARY"

          # A label count is not a selectability count: `agent:ready` and
          # `agent:blocked` are independent --label filters, so an issue
          # carrying both is counted once in each. That state is reachable —
          # `Mark failed work as blocked` in implement.yml adds agent:blocked
          # and only then removes agent:ready and agent:implementing as
          # separate calls, so a failure between the add and the removes
          # leaves an issue with all three labels. Query selectability the
          # same way `Select one ready issue` in implement.yml does, rather
          # than inferring it from the per-label counts above.
          selectable_count=$(gh issue list --repo "$TARGET_REPO" --state open \
            --label "agent:ready" \
            --search "-label:agent:implementing -label:agent:blocked" \
            --limit 200 --json number --jq 'length' || echo "?")

          # An issue keeps agent:ready while it is being implemented — `Claim the
          # issue` adds agent:implementing without removing agent:ready, and both
          # go only when the pull request opens or the run is parked. So an
          # in-flight issue is deliberately not selectable, and warning on that
          # would cry wolf for the length of every implementation run. The queue
          # is stuck only when nothing is selectable AND nothing is in flight.
          #
          # agent:implementing together with agent:blocked is never a genuinely
          # in-flight run, though: `Claim the issue` only ever labels an issue
          # that is agent:ready and not blocked, so that pairing can only be the
          # documented `Mark failed work as blocked` outcome — its 3x-retried add
          # of agent:blocked succeeded, but the single unretried removal of
          # agent:implementing and agent:ready afterward failed. Query in-flight
          # the same way selectable_count is queried above, rather than trusting
          # the raw agent:implementing label count.
          in_flight_count=$(gh issue list --repo "$TARGET_REPO" --state open \
            --label "agent:implementing" \
            --search "-label:agent:blocked" \
            --limit 200 --json number --jq 'length' || echo "?")

          # `Mark failed work as blocked` in implement.yml has a second failure
          # path (#429): when its 3x-retried --add-label agent:blocked fails
          # outright, the else arm leaves the issue on agent:ready +
          # agent:implementing with no agent:blocked at all — byte-identical
          # to a healthy in-flight run. No label query can tell those apart,
          # so in_flight_count above can be wrong in a way this step cannot
          # self-correct from labels alone.
          #
          # Chosen independent signal: whether a run of the "Agent ·
          # Implement" workflow is actually executing right now, via the
          # actions:read this job already holds. Identified by display name,
          # not by file path: in this control repository that workflow lives
          # at .github/workflows/implement.yml and runs directly on its own
          # schedule, so it produces first-class runs under that file. In an
          # onboarded target repository the only copy present is the caller
          # template at templates/workflows/agent-implement.yml, which calls
          # this reusable workflow with `uses:` — the reusable workflow then
          # runs as a job inside the caller's run and never produces a run
          # under its own file name there, so a lookup by file name would
          # 404 in every onboarded repo. Both the reusable workflow and the
          # caller template declare `name: Agent · Implement`, so the
          # display name is the one token identical in the control repo and
          # every onboarded repo.
          #
          # That workflow's concurrency group allows at most one such run at
          # a time per repo, and that run stays "in_progress" for its entire
          # job duration — including the tail after `Open a draft pull
          # request`, since the job keeps running failure-handling steps
          # after that point. So this cannot reopen the false-alarm class
          # #420 closed: a genuinely in-flight run is never mistaken for
          # stale.
          #
          # Failure modes:
          # - Not found: no workflow named "Agent · Implement" exists in
          #   this repo at all. gh run list fails immediately with "could
          #   not find any workflows named ..." — a permanent condition, not
          #   the transient class the retry loop below exists for, so it is
          #   detected and reported plainly without retrying rather than
          #   burning three sleeps to reach the same answer and hiding a
          #   naming bug behind an API-flakiness warning.
          # - Name collision: a target repository that happens to already
          #   own an unrelated workflow also named "Agent · Implement" would
          #   have its run status read here instead — a false positive this
          #   check has no way to detect.
          # - Ambiguous count: this only proves the lane is busy, not which
          #   issue it is working on, so if in_flight_count is more than one
          #   and a run is in progress, a stale straggler mixed in with a
          #   genuine one is not distinguished — the count is trusted as-is,
          #   which stays on the safe (no false alarm) side.
          # - Transport failure: if the check cannot be confirmed after 3
          #   retries, this falls back to trusting the label-derived
          #   in_flight_count unmodified, so a transient failure here cannot
          #   manufacture a false alarm either; it can only leave this
          #   particular stranding undetected for one more run.
          if [[ "$in_flight_count" =~ ^[0-9]+$ && "$in_flight_count" -gt 0 ]]; then
            live_run_count=""
            live_run_ok=false
            workflow_not_found=false
            for ATTEMPT in 1 2 3; do
              RUN_LIST_ERR=$(mktemp)
              if live_run_count=$(gh run list --repo "$TARGET_REPO" \
                  --workflow "Agent · Implement" --status in_progress \
                  --limit 100 --json databaseId --jq 'length' 2>"$RUN_LIST_ERR"); then
                live_run_ok=true
                break
              fi
              if grep -q "could not find any workflows named" "$RUN_LIST_ERR"; then
                workflow_not_found=true
                break
              fi
              sleep "$ATTEMPT"
            done

            if [ "$workflow_not_found" = "true" ]; then
              echo "::warning::Could not locate a workflow named \"Agent · Implement\" in $TARGET_REPO; trusting the label-derived in-flight count of $in_flight_count."
            elif [[ "$live_run_ok" == "true" && "$live_run_count" =~ ^[0-9]+$ ]]; then
              if [[ "$live_run_count" -eq 0 ]]; then
                echo "::warning::$in_flight_count issue(s) carry agent:implementing with no live implement run behind them; no longer counting as in flight."
                in_flight_count=0
              fi
            else
              echo "::warning::Could not confirm whether an implement run is genuinely in flight after retries; trusting the label-derived in-flight count of $in_flight_count."
            fi
          fi

          if [[ "$selectable_count" =~ ^[0-9]+$ && "$blocked_count" =~ ^[0-9]+$ &&
                "$in_flight_count" =~ ^[0-9]+$ ]] &&
             (( selectable_count == 0 && in_flight_count == 0 && blocked_count > 0 )); then
            {
              echo
              echo "> [!WARNING]"
              echo "> Queue cannot drain: nothing is selectable, nothing is in flight, and $blocked_count are blocked."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
