name: Agent · Discover & Plan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      max_items:
        description: Maximum issues to create or refine
        required: false
        default: 3
        type: number
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  discover-plan:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: agent-discover-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agent prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          # Pair control-repository workflows with their prompt commit; target
          # repositories consume both halves at v1.
          ref: ${{ github.repository == 'jirathip-k/agent-ops' && github.sha || 'v1' }}
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Ensure lifecycle labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:needs-plan" --repo "$TARGET_REPO" --force \
            --color "d4c5f9" --description "Awaiting triage and a complete plan"
          gh label create "agent:ready" --repo "$TARGET_REPO" --force \
            --color "1d76db" --description "Ready for unattended implementation"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"
          gh label create "agent:implementing" --repo "$TARGET_REPO" --force \
            --color "fbca04" --description "Claimed by the implementation lane"
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:approved" --repo "$TARGET_REPO" --force \
            --color "2cbe4e" --description "Agent review passed; human merge required"

      - name: Discover and plan
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            MAX_ITEMS: ${{ inputs.max_items || 3 }}

            Follow .agent-ops-control/prompts/discover-plan.md exactly.
            Work in the checked-out repository root.
          claude_args: >-
            --model ${{ inputs.model || 'fable' }}
            --max-turns 30
            --setting-sources user
            --json-schema
            '{"type":"object","additionalProperties":false,"required":["transitions"],"properties":{"transitions":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["issue","add","remove"],"properties":{"issue":{"type":"integer"},"add":{"type":"array","items":{"type":"string","enum":["agent:needs-plan","agent:ready","agent:blocked"]}},"remove":{"type":"array","items":{"type":"string","enum":["agent:needs-plan","agent:ready","agent:blocked"]}}}}}}}'
            --allowedTools
            "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(gh run view:*)"

      - name: Apply label transitions
        id: transitions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          # Label transitions are the model's structured output, not a tool
          # call, and that output is untrusted data: it is validated against
          # live issue state and a fixed label vocabulary before anything is
          # written. #370 dropped Bash(gh issue edit:*) from the lane's
          # allowlist for exactly this reason — this step is now the only
          # place a lifecycle label changes on an existing issue.
          #
          # An empty STRUCTURED_OUTPUT means --json-schema never produced a
          # conforming terminating call — most likely --max-turns exhausted
          # first (see #374, which cost five hours of reddened idle runs to
          # the same failure mode). That must fail loudly, not apply nothing
          # and pass as a quiet idle run.
          if [ -z "$STRUCTURED_OUTPUT" ]; then
            echo "::error::Discover and plan produced no structured output; no label transitions could be validated."
            exit 1
          fi

          OUTPUT_FILE=$(mktemp)
          printf '%s' "$STRUCTURED_OUTPUT" > "$OUTPUT_FILE"

          if ! jq -e '(.transitions // []) | type == "array"' "$OUTPUT_FILE" > /dev/null 2>&1; then
            echo "::error::Discover and plan's structured output did not conform to the expected schema."
            exit 1
          fi

          TRANSITIONS_FILE=$(mktemp)
          jq -c '.transitions // [] | .[]' "$OUTPUT_FILE" > "$TRANSITIONS_FILE"

          {
            echo "## Label transitions"
            echo
            echo "| Issue | Outcome |"
            echo "| ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          APPLIED=0
          REJECTED=0

          while IFS= read -r TRANSITION; do
            [ -z "$TRANSITION" ] && continue

            # Only a digit string is ever interpolated into a gh command or
            # printed below; a non-numeric value is rejected before it
            # touches anything else.
            ISSUE=$(printf '%s' "$TRANSITION" | jq -r '.issue // empty')
            if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
              echo "::warning::Discover and plan proposed a transition with a non-numeric issue number; rejected."
              echo "| ? | rejected: non-numeric issue number |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # A transient read failure here must not silently drop a proposed
            # transition; retry before rejecting it as unvalidatable.
            CURRENT=""
            CURRENT_OK=false
            for ATTEMPT in 1 2 3; do
              if CURRENT=$(gh issue view "$ISSUE" --repo "$TARGET_REPO" --json state,labels,author); then
                CURRENT_OK=true
                break
              fi
              sleep "$ATTEMPT"
            done

            if [ "$CURRENT_OK" != "true" ]; then
              echo "::warning::Could not read live state for issue $ISSUE after retries; its proposed transition was rejected."
              echo "| #$ISSUE | rejected: could not read live issue state |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # Every invariant lives in jq, never in bash string comparisons,
            # so an add/remove value that somehow escaped the schema's enum
            # is only ever compared inside jq and is never interpolated into
            # a command or echoed unfenced.
            REASON=$(jq -nr \
              --argjson t "$TRANSITION" \
              --argjson cur "$CURRENT" \
              --argjson known '["agent:needs-plan","agent:ready","agent:blocked"]' \
              --arg lane_author "app/github-actions" \
              '
              ($t.add // []) as $add
              | ($t.remove // []) as $remove
              | ($cur.labels | map(.name)) as $current
              | if (($add + $remove) | any(. as $l | ($known | index($l)) == null)) then
                  "unknown label"
                elif ($add | any(. as $l | ($remove | index($l)) != null)) then
                  "same label in add and remove"
                elif ($cur.state != "OPEN") then
                  "issue is not open"
                elif (($current | index("agent:implementing")) != null) then
                  "issue is agent:implementing"
                elif (($current | index("agent:review")) != null) then
                  "issue is agent:review"
                elif ((($current - $remove) + $add) as $result
                      | (($result | index("agent:needs-plan")) != null)
                        and (($result | index("agent:ready")) != null)) then
                  "would leave agent:needs-plan and agent:ready both set"
                elif ((($add | index("agent:needs-plan")) != null)
                      and ($cur.author.login != $lane_author)) then
                  "agent:needs-plan may only be added to an issue this lane created"
                else
                  "ok"
                end
              ')

            if [ "$REASON" != "ok" ]; then
              echo "::warning::Issue $ISSUE: transition rejected ($REASON)."
              echo "| #$ISSUE | rejected: $REASON |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # A temp file, not `< <(process substitution)`: substitution
            # discards the feeding pipeline's exit status, so a failing jq
            # here would go unnoticed under this step's implicit `bash -e`
            # and silently yield an empty label list instead of a hard stop.
            ADD_FILE=$(mktemp)
            printf '%s' "$TRANSITION" | jq -r '.add // [] | .[]' > "$ADD_FILE"
            ADD_ARGS=()
            while IFS= read -r LABEL; do
              [ -z "$LABEL" ] && continue
              ADD_ARGS+=(--add-label "$LABEL")
            done < "$ADD_FILE"

            REMOVE_FILE=$(mktemp)
            printf '%s' "$TRANSITION" | jq -r '.remove // [] | .[]' > "$REMOVE_FILE"
            REMOVE_ARGS=()
            while IFS= read -r LABEL; do
              [ -z "$LABEL" ] && continue
              REMOVE_ARGS+=(--remove-label "$LABEL")
            done < "$REMOVE_FILE"

            # gh issue edit applies adds and removes concurrently (see the
            # same note in implement.yml's "Mark failed work as blocked"),
            # so a combined call that fails partway can strip more labels
            # than intended. Apply the addition first: a failure after that
            # point leaves the issue with an extra label, never with none.
            APPLY_OK=true
            if [ "${#ADD_ARGS[@]}" -gt 0 ]; then
              ADD_DONE=false
              for ATTEMPT in 1 2 3; do
                if gh issue edit "$ISSUE" --repo "$TARGET_REPO" "${ADD_ARGS[@]}"; then
                  ADD_DONE=true
                  break
                fi
                sleep "$ATTEMPT"
              done
              [ "$ADD_DONE" = "true" ] || APPLY_OK=false
            fi

            if [ "$APPLY_OK" = "true" ] && [ "${#REMOVE_ARGS[@]}" -gt 0 ]; then
              REMOVE_DONE=false
              for ATTEMPT in 1 2 3; do
                if gh issue edit "$ISSUE" --repo "$TARGET_REPO" "${REMOVE_ARGS[@]}"; then
                  REMOVE_DONE=true
                  break
                fi
                sleep "$ATTEMPT"
              done
              [ "$REMOVE_DONE" = "true" ] || APPLY_OK=false
            fi

            if [ "$APPLY_OK" = "true" ]; then
              echo "Applied transition for issue $ISSUE."
              echo "| #$ISSUE | applied |" >> "$GITHUB_STEP_SUMMARY"
              APPLIED=$((APPLIED + 1))
            else
              echo "::warning::Issue $ISSUE: a validated transition could not be fully applied after retries."
              echo "| #$ISSUE | error: apply failed after retries |" >> "$GITHUB_STEP_SUMMARY"
              REJECTED=$((REJECTED + 1))
            fi
          done < "$TRANSITIONS_FILE"

          echo "Applied: $APPLIED, rejected: $REJECTED." >> "$GITHUB_STEP_SUMMARY"

      - name: Print Claude execution result
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          log_path="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [[ ! -f "$log_path" ]]; then
            echo "Claude execution log not found at $log_path"
            exit 0
          fi

          echo "Final Claude execution result:"
          jq -s '[.[] | if type == "array" then .[] else . end | select(.type == "result")] | last' "$log_path"

      - name: Report queue health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # agent:review, agent:approved, and agent:changes-requested are only
          # ever applied to pull requests, and `gh issue list` excludes those —
          # counting them as issues would report 0 forever. agent:blocked is
          # the one lifecycle label applied to both kinds of work — `Mark
          # failed work as blocked` in implement.yml labels issues, `Mark
          # failed review as blocked` in review-release.yml labels pull
          # requests — so it appears in both lists below and gets a row for
          # each scope.
          issue_labels=(
            "agent:needs-plan"
            "agent:ready"
            "agent:implementing"
            "agent:blocked"
          )
          pr_labels=(
            "agent:review"
            "agent:approved"
            "agent:changes-requested"
            "agent:blocked"
          )

          {
            echo "## Agent queue health"
            echo
            echo "| Lifecycle label | Scope | Open |"
            echo "| --- | --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          blocked_count=0
          for label in "${issue_labels[@]}"; do
            count=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label "$label" --limit 200 --json number --jq 'length' || echo "?")
            echo "| \`$label\` | issues | $count |" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$label" == "agent:blocked" ]]; then
              blocked_count=$count
            fi
          done

          for label in "${pr_labels[@]}"; do
            count=$(gh pr list --repo "$TARGET_REPO" --state open \
              --label "$label" --limit 200 --json number --jq 'length' || echo "?")
            echo "| \`$label\` | pull requests | $count |" >> "$GITHUB_STEP_SUMMARY"
          done

          # A label count is not a selectability count: `agent:ready` and
          # `agent:blocked` are independent --label filters, so an issue
          # carrying both is counted once in each. That state is reachable —
          # `Mark failed work as blocked` in implement.yml adds agent:blocked
          # and only then removes agent:ready and agent:implementing as
          # separate calls, so a failure between the add and the removes
          # leaves an issue with all three labels. Query selectability the
          # same way `Select one ready issue` in implement.yml does, rather
          # than inferring it from the per-label counts above.
          selectable_count=$(gh issue list --repo "$TARGET_REPO" --state open \
            --label "agent:ready" \
            --search "-label:agent:implementing -label:agent:blocked" \
            --limit 200 --json number --jq 'length' || echo "?")

          # An issue keeps agent:ready while it is being implemented — `Claim the
          # issue` adds agent:implementing without removing agent:ready, and both
          # go only when the pull request opens or the run is parked. So an
          # in-flight issue is deliberately not selectable, and warning on that
          # would cry wolf for the length of every implementation run. The queue
          # is stuck only when nothing is selectable AND nothing is in flight.
          #
          # agent:implementing together with agent:blocked is never a genuinely
          # in-flight run, though: `Claim the issue` only ever labels an issue
          # that is agent:ready and not blocked, so that pairing can only be the
          # documented `Mark failed work as blocked` outcome — its 3x-retried add
          # of agent:blocked succeeded, but the single unretried removal of
          # agent:implementing and agent:ready afterward failed. Query in-flight
          # the same way selectable_count is queried above, rather than trusting
          # the raw agent:implementing label count.
          in_flight_count=$(gh issue list --repo "$TARGET_REPO" --state open \
            --label "agent:implementing" \
            --search "-label:agent:blocked" \
            --limit 200 --json number --jq 'length' || echo "?")

          if [[ "$selectable_count" =~ ^[0-9]+$ && "$blocked_count" =~ ^[0-9]+$ &&
                "$in_flight_count" =~ ^[0-9]+$ ]] &&
             (( selectable_count == 0 && in_flight_count == 0 && blocked_count > 0 )); then
            {
              echo
              echo "> [!WARNING]"
              echo "> Queue cannot drain: nothing is selectable, nothing is in flight, and $blocked_count are blocked."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
