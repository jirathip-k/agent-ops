# Reusable spec pipeline workflow.
# Runs the real `agent spec` CLI against a managed repo — the same code path
# as local spec runs, so verdicts can't drift between lanes. Managed repos
# call this via workflow_call (see stubs/managed-repo-spec.yml).
#
# Label-gated: only issues carrying `spec-requested` are picked up (or one
# explicit issue number), so this lane never burns tokens unprompted. The
# spec lands as an issue comment ("## Agent spec") with checklist acceptance
# criteria — the human only has to read it and flip the label to agent-ready.
# An ESCALATE from the spec agent fails the run visibly, never silently.

name: Reusable · Spec Pipeline

on:
  workflow_call:
    inputs:
      target_repo:
        description: "owner/repo to spec issues in"
        required: true
        type: string
      issue:
        description: "Single issue number to spec (0 = select by spec-requested label)"
        required: false
        type: number
        default: 0
      max_issues:
        description: "Max label-selected issues to spec per run"
        required: false
        type: number
        default: 2
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo to spec issues in"
        required: true
        type: string
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest

jobs:
  spec:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Deliberately the SAME group as the groom/triage pipelines: spec posts
    # comments and edits labels on the same issues, so a repo is never
    # specced while it's being groomed or triaged.
    concurrency:
      group: agent-triage-${{ inputs.target_repo }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # Idle guard: no spec-requested issue → nothing to spec, skip the
      # Claude session entirely. Runs in seconds, free.
      - name: Select issues to spec
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline interpolation — keeps caller input out of the script.
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE: ${{ inputs.issue }}
          MAX_ISSUES: ${{ inputs.max_issues }}
        run: |
          ISSUE="${ISSUE:-0}"           # workflow_dispatch omits the input
          MAX_ISSUES="${MAX_ISSUES:-2}"
          # Register the gate label here, in the step that ALWAYS runs. It used
          # to live in the run step below, which is guarded on this step finding
          # a labelled issue — so on a fresh repo the label could never exist,
          # nothing could carry it, and the step that would have created it was
          # never reached. Also keeps --remove-label from tripping on a missing
          # label. Costs one API call per run.
          gh label create spec-requested --repo "$TARGET_REPO" --color 5319e7 \
            --description "Human asked the agent to write a spec" --force
          DEFERRED=""
          if [ "$ISSUE" != "0" ]; then
            ISSUES="$ISSUE"
          else
            # Oldest-first so long-parked ideas get specced before fresh ones;
            # needs-human/blocked always win over the spec-requested gate.
            MATCHED=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label spec-requested --limit 100 --json number,labels \
              --jq '[.[] | select(
                ([.labels[].name] | map(. == "needs-human" or . == "blocked") | any) | not
              ) | .number] | sort | .[]')
            ISSUES=$(echo "$MATCHED" | head -n "$MAX_ISSUES" | xargs)
            # Everything past the cap waits for a later run. Reported so a
            # queued issue is distinguishable from one the gate never saw.
            DEFERRED=$(echo "$MATCHED" | tail -n "+$((MAX_ISSUES + 1))" | xargs)
          fi
          COUNT=$(echo "$ISSUES" | wc -w | tr -d ' ')
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Issues to spec: ${ISSUES:-none}"
          if [ -n "$DEFERRED" ]; then
            echo "Queued for a later run (max_issues=$MAX_ISSUES): $DEFERRED"
            echo "Queued for a later run (\`max_issues=$MAX_ISSUES\`): $DEFERRED" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout control repo (CLI + prompts)
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: jirathip-k/agent-ops
          path: agent-ops

      - name: Checkout target repo
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Install uv
        if: steps.precheck.outputs.count != '0'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        if: steps.precheck.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run spec
        if: steps.precheck.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Via env, not inline interpolation — keeps caller input out of the script.
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUES: ${{ steps.precheck.outputs.issues }}
        working-directory: agent-ops
        run: |
          FAILED=""
          for N in $ISSUES; do
            echo "::group::spec issue #$N"
            if uv run agent spec "$N" -C "$GITHUB_WORKSPACE/target"; then
              # Done: drop the gate label so the next run doesn't redo it.
              gh issue edit "$N" --repo "$TARGET_REPO" \
                --remove-label spec-requested || true
            else
              # An ESCALATE (or crash) must fail the run visibly — but only
              # after the remaining issues get their turn.
              FAILED="$FAILED $N"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Spec failed for issue(s):$FAILED"
            exit 1
          fi
