# Generated from agent-ops/stubs/managed-repo-plan.yml for jirathip-k.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.
#
# Runs nightly and on demand: label an issue `plan-requested`, then wait
# for the nightly run or press "Run workflow". The pipeline is label-gated,
# so a night with no labeled issues skips the Claude session and costs
# nothing.

name: Agent Plan

on:
  schedule:
    - cron: '20 19 * * *'  # 02:20 Asia/Bangkok (UTC+7), staggered after spec (shared agent-triage concurrency group)
  workflow_dispatch: {}   # manual "run now" button

jobs:
  plan:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: read
      issues: write
    uses: jirathip-k/agent-ops/.github/workflows/plan-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      # issue: 123      # optional: plan one specific issue instead of by label
      # max_issues: 2   # optional: cap label-selected issues per run
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
