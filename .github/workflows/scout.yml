# Generated from agent-ops/stubs/managed-repo-scout.yml for jirathip-k.
#
# Requires the same setup as the triage stub: CLAUDE_CODE_OAUTH_TOKEN secret
# and workflow-reuse access on the agent-ops repo.
#
# Runs daily: scout mines signals already in the repo (TODOs, deferred
# review threads, gaps) and files at most 3 backlog issues, which the
# same morning's triage and groom runs then pick up.

name: Agent Scout

on:
  schedule:
    # 01:00 Asia/Bangkok (UTC+7) — daily, feeds the 03:00 triage tick and
    # the 08:00 groom, so scouted issues enter the funnel the same morning.
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # manual "run now" button

jobs:
  scout:
    # The caller must grant everything the pipeline requests — a called
    # workflow cannot exceed the caller's token.
    permissions:
      contents: read
      issues: write
    uses: jirathip-k/agent-ops/.github/workflows/scout-pipeline.yml@main
    with:
      target_repo: ${{ github.repository }}
      # max_issues: 3   # optional: cap issues filed per run
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
