name: Agent · Review & Release

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: opus
        type: string
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: opus
        type: string
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # Optional on purpose. The workflow GITHUB_TOKEN cannot call
      # markPullRequestReadyForReview — GitHub rejects it as "Resource not
      # accessible by integration" even with pull-requests: write — so the
      # draft lift needs the custom App. Callers onboarded before this change
      # do not pass these, and must keep working: without them the lane still
      # reviews and labels, and only the lift is skipped, loudly.
      AGENT_APP_ID:
        required: false
      AGENT_APP_PRIVATE_KEY:
        required: false

jobs:
  review-release:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 40
    concurrency:
      group: agent-review-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - name: Ensure review labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:approved" --repo "$TARGET_REPO" --force \
            --color "2cbe4e" --description "Agent review passed; human merge required"
          gh label create "agent:changes-requested" --repo "$TARGET_REPO" --force \
            --color "d93f0b" --description "Agent review found blocking changes"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"

      - name: Select one pull request
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --repo "$TARGET_REPO" --state open --label "agent:review" \
            --limit 100 --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // 0')
          if [ "$PR" = "0" ]; then
            echo "pr=0" >> "$GITHUB_OUTPUT"
            echo "No pull request is waiting for review."
            {
              echo "## Review & Release"
              echo
              echo "No pull request is waiting for review."
              echo
              echo "Open pull requests by lifecycle label:"
              # An idle lane must stay green, so a transient API error here must
              # not fail the step; report an unknown count instead.
              for LABEL in agent:review agent:approved agent:changes-requested agent:blocked; do
                COUNT=$(gh pr list --repo "$TARGET_REPO" --state open --label "$LABEL" \
                  --limit 200 --json number --jq 'length' || echo "?")
                echo "- \`$LABEL\`: $COUNT"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Selected PR: $PR"
          echo "Selected pull request: #$PR" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the linked issue
        id: issue
        if: steps.select.outputs.pr != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # Use GitHub's own link resolution rather than a body regex, so prose
          # that merely looks like a closing keyword cannot select an issue.
          # Restrict to this repository: the reference carries its owning repo,
          # and `Closes otherowner/otherrepo#42` would otherwise fetch whatever
          # this repository happens to number 42 and review against it.
          #
          # A transient API error here is indistinguishable from a real one,
          # so retry before failing closed. The value is captured inside the
          # loop itself: testing the call and then re-running it would double
          # the API cost and could observe different state between the check
          # and the real read.
          REFS=""
          RESOLVE_OK=false
          for ATTEMPT in 1 2 3; do
            if REFS=$(gh pr view "$PR" --repo "$TARGET_REPO" --json closingIssuesReferences \
                --jq '[ .closingIssuesReferences[]
                        | select((.repository.owner.login + "/" + .repository.name) == env.TARGET_REPO)
                        | .number ] | join(" ")'); then
              RESOLVE_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$RESOLVE_OK" != "true" ]; then
            echo "::error::Pull request $PR: could not resolve the linked issue after retries."
            exit 1
          fi

          read -r -a REF_NUMBERS <<< "$REFS"
          ISSUE=${REF_NUMBERS[0]:-0}
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          # Every other degradation in this lane is loud. A review with no
          # acceptance criteria to check against must be too: it can still
          # return APPROVE, and agent:approved is the only gate on the draft
          # lift.
          if [ "$ISSUE" = "0" ]; then
            echo "::warning::Pull request $PR closes no issue in $TARGET_REPO; the reviewer has no acceptance criteria to check."
            echo "Linked issue: none — reviewed without acceptance criteria." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Linked issue: #$ISSUE" >> "$GITHUB_STEP_SUMMARY"
            if [ "${#REF_NUMBERS[@]}" -gt 1 ]; then
              echo "::warning::Pull request $PR closes ${#REF_NUMBERS[@]} issues; reviewing against #$ISSUE only."
            fi
          fi

      - name: Fetch the linked issue
        if: steps.select.outputs.pr != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.issue.outputs.issue }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_FILE: ${{ runner.temp }}/agent-issue.md
        run: |
          if [ "$ISSUE" = "0" ]; then
            echo "No linked issue was found for this pull request." > "$ISSUE_FILE"
            exit 0
          fi

          # The select admits two independent things: comments whose
          # authorAssociation is OWNER, MEMBER, or COLLABORATOR, and,
          # regardless of association, any comment authored by the
          # github-actions login. The association clause alone is "invited
          # to the repository or affiliated with the owning org", not "has
          # write access": COLLABORATOR includes read-only and triage
          # invitees, and on a public repository MEMBER means org
          # membership, which does not by itself imply any repository
          # permission. By association alone the filter excludes NONE,
          # CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, and
          # MANNEQUIN — but that exclusion does not hold for the filter as
          # a whole. The github-actions login clause bypasses association
          # entirely, and github-actions itself carries authorAssociation
          # CONTRIBUTOR in this repository: it is how the planning lane's
          # own comments are admitted. So CONTRIBUTOR is not excluded in
          # general, only a CONTRIBUTOR comment from a login other than
          # github-actions is. On a public repository anyone can comment on
          # an issue that is already agent:ready, so an unfiltered read
          # would hand the untrusted input surface to the whole internet.
          #
          # github-actions is admitted by login, not by provenance: any
          # workflow in the target repository that comments with the
          # default GITHUB_TOKEN posts as github-actions, so a CI reporter
          # that echoes fork-authored text into a comment would be
          # admitted too, indistinguishable from genuine CI output or the
          # planning lane's own comments. A per-repository allowlist of
          # trusted reporting workflows would close that gap; this filter
          # does not have one.
          #
          # .[-5:] and [:4000] bound the volume the github-actions login
          # can put through this filter: CI reporters post as
          # github-actions and a single issue's CI traffic can run to
          # thousands of lines across many comments, and the login clause
          # admits all of it regardless of association. These two caps are
          # what keeps that path bounded. That bounding is applied to the
          # combined admitted set, after select, with no separate quota per
          # authorAssociation, so github-actions volume can evict the
          # trusted path too: measured, one OWNER comment followed by six
          # github-actions comments admits five github-actions comments and
          # drops the OWNER comment — the maintainer's instruction is gone
          # entirely.
          #
          # .body is passed through unfiltered and uncapped, unlike every
          # comment. This step only runs for an issue that a pull request
          # already claims to close, and that pull request reached this
          # lane by carrying agent:review; that pull-request-level label
          # is currently the only gate on the body's authorship, and
          # narrowing this further has not been revisited. This makes the
          # body the widest remaining public channel into this file, and
          # the only unbounded one.
          #
          # gh fetches every comment before jq discards all but the last
          # five; the filtering is client-side and cannot avoid paginating
          # first. Harmless at this system's volume, worth knowing if this
          # filter is ever reused somewhere with far more comment traffic.
          #
          # `cmd > "$ISSUE_FILE"` truncates the destination before cmd runs, so
          # retrying a failed attempt in place would risk leaving a truncated
          # file for the review step to read. Write to a scratch file instead
          # and only move it onto ISSUE_FILE once a full attempt succeeds; if
          # every retry fails, the scratch file is discarded and the step
          # fails closed without ever touching ISSUE_FILE.
          ISSUE_SCRATCH="$ISSUE_FILE.tmp"
          FETCH_OK=false
          for ATTEMPT in 1 2 3; do
            if gh issue view "$ISSUE" --repo "$TARGET_REPO" --json title,body,comments \
                --jq '[ "# " + .title, (.body // "") ]
                      + ( [ .comments[]
                            | select(.authorAssociation == "OWNER"
                                  or .authorAssociation == "MEMBER"
                                  or .authorAssociation == "COLLABORATOR"
                                  or .author.login == "github-actions") ]
                          | .[-5:]
                          | map("---\n\n### Comment by " + (.author.login // "unknown")
                                + "\n\n" + ((.body // "")[:4000])) )
                      | join("\n\n")' > "$ISSUE_SCRATCH"; then
              FETCH_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$FETCH_OK" != "true" ]; then
            rm -f "$ISSUE_SCRATCH"
            echo "::error::Could not fetch linked issue #$ISSUE after retries."
            exit 1
          fi

          mv "$ISSUE_SCRATCH" "$ISSUE_FILE"

      - name: Checkout pull-request branch
        if: steps.select.outputs.pr != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.select.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout agent prompts
        if: steps.select.outputs.pr != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          # Pair control-repository workflows with their prompt commit; target
          # repositories consume both halves at v1.
          ref: ${{ github.repository == 'jirathip-k/agent-ops' && github.sha || 'v1' }}
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        if: steps.select.outputs.pr != '0'
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Review and mark release readiness
        id: review
        if: steps.select.outputs.pr != '0'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL_REQUEST: ${{ steps.select.outputs.pr }}
            ISSUE_FILE: ${{ runner.temp }}/agent-issue.md

            Follow .agent-ops-control/prompts/review-release.md exactly.
            Read the issue from the file at ISSUE_FILE.
            Work in the checked-out pull-request branch.
          claude_args: >-
            --model ${{ inputs.model || 'opus' }}
            --max-turns 30
            --setting-sources user
            --json-schema
            '{"type":"object","additionalProperties":false,"required":["verdict","summary"],"properties":{"verdict":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"summary":{"type":"string"}}}'
            --allowedTools
            "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh run view:*)"

      - name: Apply the review verdict label
        if: steps.select.outputs.pr != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
          VERDICT: ${{ fromJSON(steps.review.outputs.structured_output || '{}').verdict }}
          SUMMARY: ${{ fromJSON(steps.review.outputs.structured_output || '{}').summary }}
        run: |
          # The reviewer no longer holds gh pr edit; this is the only place
          # a verdict label gets written, derived from the model's typed
          # structured_output rather than from prose it could stop mid-edit.
          # A step's env expressions are evaluated even when its if gate
          # skips it, so on an idle run — reviewer skipped, output empty —
          # a bare fromJSON('') is a template error that fails this step and
          # reddens the whole run. Defaulting to '{}' leaves VERDICT empty
          # instead, which the default arm below fails deliberately, from
          # the shell, where the blocked handler can see it.
          case "$VERDICT" in
            APPROVE)
              ADD_LABEL="agent:approved"
              OTHER_VERDICT_LABEL="agent:changes-requested"
              ;;
            REQUEST_CHANGES)
              ADD_LABEL="agent:changes-requested"
              OTHER_VERDICT_LABEL="agent:approved"
              ;;
            *)
              echo "::error::Pull request $PR: reviewer returned no structured verdict, or one outside the schema's enum."
              # $VERDICT is untrusted here precisely because it failed the
              # schema's enum, so it can contain anything, including embedded
              # newlines. A line `echo` emits starting with "::" is parsed by
              # the runner as a workflow command (e.g. a forged `::error::` or
              # `::add-mask::`), so fence this one echo behind stop-commands,
              # keyed on a token generated fresh in this step that the
              # untrusted value has no way to predict. `|| true` on the fenced
              # echo guarantees the resume line still runs even if that echo
              # somehow fails, so commands are never left disabled for the
              # rest of the job. The `::error::` above stays outside the
              # fenced region so the annotation still appears.
              TOKEN=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
              # tr exits 0 on empty input and there is no pipefail here, so a
              # failing head or od would yield an empty TOKEN silently. The
              # runner rejects an empty stop token and never establishes the
              # fence, which would print the untrusted value unfenced — the
              # fence would fail open, in the one step whose job is to close
              # this vector. Assert the token before relying on it, and never
              # echo the value if the assertion fails.
              if [ "${#TOKEN}" -ne 32 ]; then
                echo "::error::Could not generate a stop-commands token; withholding the reviewer's verdict value."
                exit 1
              fi
              echo "::stop-commands::$TOKEN"
              echo "Got: '$VERDICT'" || true
              echo "::$TOKEN::"
              exit 1
              ;;
          esac

          # The model's structured summary is the only place its reasoning
          # survives if the PR comment it also posts never lands (transient
          # gh failure, or the session hits its turn limit first). Record it
          # here so a verdict never lands with nothing saying why.
          #
          # GITHUB_STEP_SUMMARY is rendered as Markdown but, unlike stdout,
          # is never parsed for workflow commands, so the stop-commands fence
          # above doesn't apply here. What untrusted Markdown can still do is
          # render as if it were ours: a fake "## ..." heading claiming a
          # different verdict, raw HTML, a link. Put it in its own fenced
          # code block instead, where it renders as inert text, and bound its
          # length like the issue-comment fetch above. Widen the fence past
          # any backtick run already in the summary first, so embedded
          # backticks can't close it early and let the rest render live.
          BOUNDED_SUMMARY="${SUMMARY:0:4000}"
          FENCE='```'
          while :; do
            case "$BOUNDED_SUMMARY" in
              *"$FENCE"*) FENCE="${FENCE}\`" ;;
              *) break ;;
            esac
          done
          {
            echo
            echo "### Reviewer verdict: $VERDICT"
            echo
            echo "$FENCE"
            printf '%s\n' "$BOUNDED_SUMMARY"
            echo "$FENCE"
          } >> "$GITHUB_STEP_SUMMARY"

          # agent:review may already be gone if a human removed it while the
          # review was in flight, and the other verdict label is only present
          # on a re-review after changes were requested, so both removals are
          # built conditionally from the labels actually present rather than
          # assumed. A transient read failure here must not discard the
          # verdict the model already produced, so retry a few times before
          # falling back to adding the verdict label alone.
          LABELS=""
          LABELS_OK=false
          for ATTEMPT in 1 2 3; do
            if LABELS=$(gh pr view "$PR" --repo "$TARGET_REPO" --json labels --jq '[.labels[].name] | join(" ")'); then
              LABELS_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          # By the time either write below runs, the model's work is done and
          # only the recording remains — the write is the more valuable half
          # of this step. Retry it like the read above, and keep the same
          # fail-closed posture: if it still fails after retries, fail the
          # step so "Mark failed review as blocked" runs and a human is told,
          # rather than silently discarding a completed review.
          if [ "$LABELS_OK" != "true" ]; then
            echo "::warning::Could not read labels on pull request $PR after retries; applying $ADD_LABEL without removing any other label."
            ADD_OK=false
            for ATTEMPT in 1 2 3; do
              if gh pr edit "$PR" --repo "$TARGET_REPO" --add-label "$ADD_LABEL"; then
                ADD_OK=true
                break
              fi
              sleep "$ATTEMPT"
            done
            if [ "$ADD_OK" != "true" ]; then
              echo "::error::Pull request $PR: could not apply $ADD_LABEL after retries."
              exit 1
            fi
          else
            EDIT_ARGS=(--add-label "$ADD_LABEL")
            case " $LABELS " in
              *" agent:review "*) EDIT_ARGS+=(--remove-label "agent:review") ;;
            esac
            case " $LABELS " in
              *" $OTHER_VERDICT_LABEL "*) EDIT_ARGS+=(--remove-label "$OTHER_VERDICT_LABEL") ;;
            esac
            EDIT_OK=false
            for ATTEMPT in 1 2 3; do
              if gh pr edit "$PR" --repo "$TARGET_REPO" "${EDIT_ARGS[@]}"; then
                EDIT_OK=true
                break
              fi
              sleep "$ATTEMPT"
            done
            if [ "$EDIT_OK" != "true" ]; then
              echo "::error::Pull request $PR: could not apply verdict labels after retries."
              exit 1
            fi
          fi

      # The secrets context cannot be read from a step-level `if:`, so presence
      # is resolved into an output first.
      - name: Detect App credentials for the draft lift
        id: lift_creds
        if: steps.select.outputs.pr != '0'
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a pull-request-scoped token for the draft lift
        id: lift_token
        if: steps.select.outputs.pr != '0' && steps.lift_creds.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-metadata: read

      - name: Mark an approved pull request ready for review
        if: steps.select.outputs.pr != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lift_token.outputs.token || github.token }}
          LIFT_CREDS: ${{ steps.lift_creds.outputs.present }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # Lifting the draft is a readiness signal, not a merge: branch
          # protection and a human still own that. Deriving it from the label
          # the reviewer applied keeps it out of the model's hands, so a
          # REQUEST_CHANGES verdict can never lift the draft.
          # This step is continue-on-error under bash -e, so an unretried
          # read that fails here aborts above every loud path below and the
          # run stays green with the lift silently skipped — exactly the
          # outcome this step's rework exists to prevent. Retry the read,
          # and if it still fails, say so loudly instead of dying quietly.
          STATE=""
          STATE_OK=false
          for ATTEMPT in 1 2 3; do
            if STATE=$(gh pr view "$PR" --repo "$TARGET_REPO" --json isDraft,labels \
                --jq '.isDraft, ([.labels[].name] | join(" "))'); then
              STATE_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$STATE_OK" != "true" ]; then
            # Labels are unknown on this path, so the message must not claim
            # the pull request is approved.
            echo "::warning::Could not read state for pull request $PR after retries; the draft lift could not be evaluated."
            {
              echo "> [!WARNING]"
              echo "> Pull request #$PR's state could not be read, so the draft lift"
              echo "> could not be evaluated. If it is approved and still a draft,"
              echo "> lift it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DRAFT=$(printf '%s\n' "$STATE" | head -1)
          LABELS=$(printf '%s\n' "$STATE" | tail -1)

          if [ "$DRAFT" != "true" ]; then
            echo "Pull request $PR is already out of draft."
            exit 0
          fi
          case " $LABELS " in
            *" agent:approved "*) ;;
            *)
              echo "Pull request $PR is not approved; leaving it as a draft."
              exit 0
              ;;
          esac

          # A silently skipped or failed lift used to disappear into a green
          # run, so the documented lifecycle claimed something that never
          # happened. Every outcome below reaches the run summary.
          if [ "$LIFT_CREDS" != "true" ]; then
            echo "::warning::Approved pull request $PR was left as a draft: AGENT_APP_ID and AGENT_APP_PRIVATE_KEY are not passed to this lane."
            {
              echo "> [!WARNING]"
              echo "> Pull request #$PR is approved but still a draft. The workflow"
              echo "> token cannot lift it. Pass \`AGENT_APP_ID\` and"
              echo "> \`AGENT_APP_PRIVATE_KEY\` to this lane's caller, then lift it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The gh pr ready write below was, until now, a single attempt. On
          # the normal path through "Apply the review verdict label" (its
          # label read succeeded), that step removes agent:review before
          # this step runs, so a failed lift here is permanent: Select one
          # pull request filters on agent:review and can never re-select
          # this pull request to retry it. On that step's own fallback path
          # (its label read exhausted retries), it adds the verdict label
          # without removing agent:review, so agent:review is still present
          # here and a failed lift in fact gets re-selected and retried on
          # the next tick. The dominant path is genuinely permanent, so
          # retry this write with the same house pattern regardless.
          LIFT_OK=false
          for ATTEMPT in 1 2 3; do
            if gh pr ready "$PR" --repo "$TARGET_REPO"; then
              LIFT_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$LIFT_OK" = "true" ]; then
            echo "Marked pull request $PR ready for review; a human owns the merge."
            echo "Marked pull request #$PR ready for review; a human owns the merge." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to lift pull request $PR out of draft after retries; it stays approved and drafted."
            {
              echo "> [!WARNING]"
              echo "> Pull request #$PR is approved but the draft lift failed after retries."
              echo "> Confirm the App is installed on this repository with"
              echo "> Pull requests: read and write, then lift it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark failed review as blocked
        if: >-
          (failure() || cancelled()) &&
          steps.select.outcome == 'success' &&
          steps.select.outputs.pr != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # The "Apply the review verdict label" step may have already run
          # before this failure. If it did, parking the pull request would
          # contradict a verdict that was actually reached. Test for the
          # verdict itself: the absence of agent:review does not prove one
          # was recorded, and treating it as proof is what stranded pull
          # requests with no label.
          #
          # This step's whole purpose is handling failure, and it is already
          # continue-on-error, so an unretried read that fails here just
          # vanishes: no park, no comment, agent:review stays, and an hourly
          # rerun burns a review session with no human signal ever posted.
          # Retry it, and if it still fails, say so instead of parking
          # blind — with the labels unknown, adding agent:blocked could
          # contradict a verdict that was already recorded.
          LABELS=""
          LABELS_OK=false
          for ATTEMPT in 1 2 3; do
            if LABELS=$(gh pr view "$PR" --repo "$TARGET_REPO" --json labels \
                --jq '[.labels[].name] | join(" ")'); then
              LABELS_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$LABELS_OK" != "true" ]; then
            echo "::warning::Could not read labels on pull request $PR after retries; it was neither parked nor commented, and may be re-reviewed next run."
            exit 0
          fi

          case " $LABELS " in
            *" agent:approved "* | *" agent:changes-requested "*)
              echo "Verdict already applied to pull request $PR; leaving labels alone."
              exit 0
              ;;
          esac
          # agent:review may already be gone, so removing it is conditional;
          # a single gh pr edit would fail on the missing label and skip the add.
          case " $LABELS " in
            *" agent:review "*)
              gh pr edit "$PR" --repo "$TARGET_REPO" --remove-label "agent:review" ||
                echo "::warning::Could not remove agent:review from pull request $PR."
              ;;
          esac
          gh pr edit "$PR" --repo "$TARGET_REPO" --add-label "agent:blocked" ||
            echo "::warning::Could not update labels on pull request $PR."
          # By this point agent:blocked has already been attempted (it may
          # have failed above, warned, and continued), so a failure here
          # would otherwise leave the park with no explanation and no trace
          # beyond a non-zero exit inside this continue-on-error step. Guard
          # it like its sibling in the lifecycle-label safety net below.
          gh pr comment "$PR" --repo "$TARGET_REPO" \
            --body "Review stopped. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, then remove agent:blocked and restore agent:review to retry." ||
            echo "::warning::Could not comment on pull request $PR explaining the park."

      - name: Ensure the reviewed pull request keeps a lifecycle label
        if: >-
          always() &&
          steps.select.outcome == 'success' &&
          steps.select.outputs.pr != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # Last resort, after every other handler. Selection only sees
          # agent:review, so a pull request carrying no lifecycle label at all
          # is invisible to this lane forever and absent from the queue-health
          # summary. Restoring agent:review makes the next scheduled run
          # re-review it, which converges; parking would need a human instead.
          #
          # This is the final line of defense in the job, and it is already
          # continue-on-error, so an unretried read that fails here means the
          # safety net silently does nothing — if the pull request genuinely
          # ended the run label-less, it becomes permanently invisible, with
          # nothing reaching the run summary. Retry the read, and on
          # exhaustion warn loudly rather than blindly re-adding
          # agent:review, which would cost a redundant review session on
          # every exhausted transient even when the pull request in fact
          # still holds a lifecycle label.
          LABELS=""
          LABELS_OK=false
          for ATTEMPT in 1 2 3; do
            if LABELS=$(gh pr view "$PR" --repo "$TARGET_REPO" --json labels \
                --jq '[.labels[].name] | join(" ")'); then
              LABELS_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done

          if [ "$LABELS_OK" != "true" ]; then
            echo "::warning::Could not read labels on pull request $PR after retries; the lifecycle-label safety net could not run."
            {
              echo "> [!WARNING]"
              echo "> Pull request #$PR's labels could not be read, so the"
              echo "> lifecycle-label safety net could not run. Inspect it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case " $LABELS " in
            *" agent:review "* | *" agent:approved "* | \
            *" agent:changes-requested "* | *" agent:blocked "*)
              exit 0
              ;;
          esac

          echo "::warning::Pull request $PR ended the run with no lifecycle label; restoring agent:review."
          {
            echo "> [!WARNING]"
            echo "> Pull request #$PR lost every lifecycle label during this run."
            echo "> \`agent:review\` was restored so the next run re-reviews it."
          } >> "$GITHUB_STEP_SUMMARY"

          # This is the last-resort handler: nothing runs after it, so a
          # failure here is not merely unreported like elsewhere, it is
          # unrecoverable until a human intervenes by hand. The read above
          # that gates this step already retries; give the write that is the
          # actual safety net the same treatment, and escalate exhaustion to
          # ::error:: rather than ::warning:: since no later step can notice.
          ADD_OK=false
          for ATTEMPT in 1 2 3; do
            if gh pr edit "$PR" --repo "$TARGET_REPO" --add-label "agent:review"; then
              ADD_OK=true
              break
            fi
            sleep "$ATTEMPT"
          done
          if [ "$ADD_OK" != "true" ]; then
            echo "::error::Pull request $PR: could not restore agent:review after retries; it is left with no lifecycle label and nothing further will retry it. Add agent:review by hand."
          fi

          gh pr comment "$PR" --repo "$TARGET_REPO" \
            --body "This pull request ended a review run with no lifecycle label, so no lane could see it. \`agent:review\` was restored automatically; the next scheduled run will review it again. Workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." ||
            echo "::warning::Could not comment on pull request $PR."
