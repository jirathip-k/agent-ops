name: Agent · Review & Release

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
  workflow_call:
    inputs:
      model:
        description: Claude subscription model or alias
        required: false
        default: fable
        type: string
      runner:
        description: GitHub runner label
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review-release:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 40
    concurrency:
      group: agent-review-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - name: Ensure review labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh label create "agent:review" --repo "$TARGET_REPO" --force \
            --color "0e8a16" --description "Awaiting independent agent review"
          gh label create "agent:approved" --repo "$TARGET_REPO" --force \
            --color "2cbe4e" --description "Agent review passed; human merge required"
          gh label create "agent:changes-requested" --repo "$TARGET_REPO" --force \
            --color "d93f0b" --description "Agent review found blocking changes"
          gh label create "agent:blocked" --repo "$TARGET_REPO" --force \
            --color "b60205" --description "Waiting for a human decision or prerequisite"

      - name: Select one pull request
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --repo "$TARGET_REPO" --state open --label "agent:review" \
            --limit 100 --json number,createdAt \
            --jq 'sort_by(.createdAt) | .[0].number // 0')
          if [ "$PR" = "0" ]; then
            echo "pr=0" >> "$GITHUB_OUTPUT"
            echo "No pull request is waiting for review."
            {
              echo "## Review & Release"
              echo
              echo "No pull request is waiting for review."
              echo
              echo "Open pull requests by lifecycle label:"
              for LABEL in agent:review agent:approved agent:changes-requested agent:blocked; do
                COUNT=$(gh pr list --repo "$TARGET_REPO" --state open --label "$LABEL" \
                  --json number --jq 'length')
                echo "- \`$LABEL\`: $COUNT"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Selected PR: $PR"
          echo "Selected pull request: #$PR" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pull-request branch
        if: steps.select.outputs.pr != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.select.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout agent prompts
        if: steps.select.outputs.pr != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jirathip-k/agent-ops
          ref: v1
          path: .agent-ops-control
          sparse-checkout: prompts
          persist-credentials: false

      - name: Keep control files outside the target diff
        if: steps.select.outputs.pr != '0'
        run: echo "/.agent-ops-control/" >> .git/info/exclude

      - name: Review and mark release readiness
        if: steps.select.outputs.pr != '0'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL_REQUEST: ${{ steps.select.outputs.pr }}

            Follow .agent-ops-control/prompts/review-release.md exactly.
            Work in the checked-out pull-request branch.
          claude_args: >-
            --model ${{ inputs.model || 'fable' }}
            --max-turns 30
            --setting-sources user
            --allowedTools
            "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh run view:*)"

      - name: Mark failed review as blocked
        if: >-
          (failure() || cancelled()) &&
          steps.select.outcome == 'success' &&
          steps.select.outputs.pr != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.select.outputs.pr }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # The reviewer applies its own verdict labels. If it already did so and
          # the run failed afterwards, parking the pull request would contradict
          # a verdict that was actually reached.
          LABELS=$(gh pr view "$PR" --repo "$TARGET_REPO" --json labels \
            --jq '[.labels[].name] | join(" ")')
          case " $LABELS " in
            *" agent:review "*) ;;
            *)
              echo "Verdict already applied to pull request $PR; leaving labels alone."
              exit 0
              ;;
          esac
          gh pr edit "$PR" --repo "$TARGET_REPO" \
            --remove-label "agent:review" --add-label "agent:blocked" ||
            echo "::warning::Could not update labels on pull request $PR."
          gh pr comment "$PR" --repo "$TARGET_REPO" \
            --body "Review stopped. Inspect workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, then remove agent:blocked and restore agent:review to retry."
