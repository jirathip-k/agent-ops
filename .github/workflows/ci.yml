name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow syntax
        run: |
          # Installer SHA corresponds to actionlint v1.7.12.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -shellcheck= \
            .github/workflows/*.yml \
            templates/workflows/*.yml

      - name: Validate operator tooling
        run: shellcheck scripts/onboard.sh

      - name: Check AGENTS.md references resolve
        run: |
          # Stale paths are the one kind of AGENTS.md drift that is
          # mechanically verifiable, so they are checked rather than left to
          # review. Every inline-code token that looks like a repository path
          # must still exist. Tokens without a slash or a known extension
          # (secret names, model names) are not paths and are skipped.
          refs=$(grep -oE '`[^`]+`' AGENTS.md \
            | tr -d '`' \
            | grep -E '/|\.(yml|yaml|sh|md)$' \
            | sort -u || true)

          missing=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              */)
                [ -d "${ref%/}" ] || { echo "missing directory: $ref"; missing=1; }
                ;;
              *)
                [ -e "$ref" ] || { echo "missing path: $ref"; missing=1; }
                ;;
            esac
          done <<EOF
          $refs
          EOF

          if [ "$missing" -ne 0 ]; then
            echo "AGENTS.md references paths that no longer exist." >&2
            exit 1
          fi
          echo "all AGENTS.md path references resolve"
