# Reusable triage pipeline workflow.
# Managed repos call this via workflow_call (see stubs/managed-repo-triage.yml).
# Can also be run directly against this repo for testing via workflow_dispatch.

name: Reusable · Triage Pipeline

on:
  workflow_call:
    inputs:
      target_repo:
        description: "owner/repo to operate on"
        required: true
        type: string
      max_issues:
        description: "Max issues to process per run"
        required: false
        type: number
        default: 3
      auto_merge:
        description: "Allow auto-merge to staging (false = report-only)"
        required: false
        type: boolean
        default: false
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # Optional GitHub App credentials used to authenticate the pipeline's
      # git pushes (#53). Without them the pipeline falls back to
      # GITHUB_TOKEN and behaves exactly as before — including the
      # action_required gating that blocks auto-merge.
      AGENT_APP_ID:
        required: false
      AGENT_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo to operate on"
        required: true
        type: string
      auto_merge:
        description: "Allow auto-merge to staging (false = report-only)"
        required: false
        type: boolean
        default: false
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest

jobs:
  triage:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # One pipeline run per target at a time — prevents overlapping hourly
    # runs from grabbing the same issues. Job-level because workflow-level
    # concurrency breaks startup when invoked via workflow_call.
    concurrency:
      group: agent-triage-${{ inputs.target_repo }}
      cancel-in-progress: false
    timeout-minutes: 55 # must finish before the next hourly tick
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # claude-code-action exchanges an OIDC token
      # Step 3's auto-merge gate requires "all CI checks green" before it
      # squash-merges. A called workflow is capped by the caller *and* by
      # this block, and unnamed scopes resolve to none — so without these
      # the orchestrator gets 403 on check-runs and can never satisfy its
      # own gate. Callers must grant these too.
      checks: read      # check-runs (the target repo's CI job conclusions)
      statuses: read    # legacy commit statuses, for the combined rollup
      actions: read     # workflow runs — lets Step 3 distinguish "CI failed"
                        # from "CI never ran" (a run held on action_required,
                        # which otherwise looks identical to "no CI at all")
    steps:
      # Idle guard: skip the (token-costing) Claude session entirely when the
      # repo has no issue the orchestrator would act on. Runs in seconds, free.
      # Actionable = untriaged (no skip labels), OR carrying a human go-ahead
      # (agent-ready / approved-for-agent), which overrides triage:done and
      # backlog — the post-triage approval flow. needs-human/blocked always win.
      - name: Check for actionable work
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline interpolation — keeps caller input out of the script.
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          COUNT=$(gh issue list --repo "$TARGET_REPO" --state open --limit 100 \
            --json labels --jq '[.[] | [.labels[].name] as $l | select(
              (($l | map(. == "needs-human" or . == "blocked") | any) | not)
              and (
                (($l | map(. == "triage:done" or . == "backlog") | any) | not)
                or ($l | map(. == "agent-ready" or . == "approved-for-agent") | any)
              )
            )] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Actionable issues: $COUNT"

      - name: Checkout control repo (for prompts)
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          # explicit: inside a reusable workflow the default is the CALLER's
          # repo, which would put the managed repo here instead of the prompts
          repository: jirathip-k/agent-ops
          path: agent-ops

      # Why this exists (#53): actions/checkout persists its token as the git
      # credential, so every `git push` the orchestrator makes is attributed to
      # whoever owns that token. With the default GITHUB_TOKEN that's
      # github-actions[bot], and GitHub holds workflow runs triggered by that
      # identity behind a manual approval gate — they land as
      # `completed/action_required` and never execute. The orchestrator's
      # auto-merge gate then sees an empty check rollup, cannot confirm "CI
      # green", and holds the PR. That is why PRs got a green run on an earlier
      # SHA and a gated one on the head.
      #
      # A GitHub App installation token avoids this: App-triggered runs are not
      # gated (the same reason claude-code-action's own App-authored PRs always
      # ran). Credentials are optional — see docs/workflow.md for setup.
      - name: Detect App credentials
        id: appcfg
        if: steps.precheck.outputs.count != '0'
        env:
          APP_ID: ${{ secrets.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AGENT_APP_ID/AGENT_APP_PRIVATE_KEY not set — pushing as github-actions[bot]. Workflow runs on pushed commits will be gated on manual approval (jirathip-k/agent-ops#53)."
          fi

      # create-github-app-token scopes the token to one repo, so it needs the
      # owner and name separately. GitHub expressions have no split().
      - name: Split target repo
        id: split
        if: steps.appcfg.outputs.enabled == 'true'
        env:
          TARGET: ${{ inputs.target_repo }}
        run: |
          echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET##*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token
        id: app_token
        if: steps.appcfg.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ steps.split.outputs.owner }}
          repositories: ${{ steps.split.outputs.name }}

      - name: Checkout target repo
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repo }}
          # Falls back to GITHUB_TOKEN when the App isn't configured, which is
          # today's behaviour — this change is inert until the secrets exist.
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Run orchestrator
        if: steps.precheck.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Show the orchestrator's full session in the run log — needed to
          # audit which tool calls get permission-denied (47 in the first
          # working run) and to follow its triage reasoning while building
          # trust. Managed-repo logs are visible to anyone with repo access;
          # revisit if a managed repo's issues carry sensitive content.
          show_full_output: true
          # base/workhorse model (orchestrator + implementer/tester subagents);
          # the orchestrator prompt requests fable for planner/reviewer subagents
          #
          # --allowedTools is required: headless runs have nobody to approve
          # permission prompts, so any tool not listed here is silently denied
          # (a run without it burns tokens and produces zero side effects).
          # Bash is limited to the CLIs the pipeline actually needs — gh/git
          # for state, the package/test runners for gates. Repos with other
          # toolchains need their runner added here.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(pnpm:*),Bash(yarn:*),Bash(uv:*),Bash(python:*),Bash(pytest:*),Read,Grep,Glob,Edit,Write,Task,TodoWrite"
          prompt: |
            TARGET_REPO: ${{ inputs.target_repo }}
            MAX_ISSUES: ${{ inputs.max_issues }}
            AUTO_MERGE: ${{ inputs.auto_merge }}
            Working directory for the target repo: ./target
            Agent role files: ./agent-ops/prompts/agents/

            Follow the orchestrator instructions in
            ./agent-ops/prompts/orchestrator.md exactly.
