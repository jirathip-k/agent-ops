# Reusable plan pipeline workflow.
# Runs the real `agent plan --post` CLI against a managed repo — the same
# code path as local planning, so plans can't drift between lanes. Managed
# repos call this via workflow_call (see stubs/managed-repo-plan.yml).
#
# Label-gated: only issues carrying `plan-requested` are picked up (or one
# explicit issue number), so this lane never burns tokens unprompted. The
# plan lands as an issue comment ("## Agent plan") from a read-only planner
# run — the human only has to review it and flip the label to agent-ready.

name: Agent Plan Pipeline

on:
  workflow_call:
    inputs:
      target_repo:
        description: "owner/repo to plan issues in"
        required: true
        type: string
      issue:
        description: "Single issue number to plan (0 = select by plan-requested label)"
        required: false
        type: number
        default: 0
      max_issues:
        description: "Max label-selected issues to plan per run"
        required: false
        type: number
        default: 2
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo to plan issues in"
        required: true
        type: string
      runner:
        description: "Runner label for the job (e.g. blacksmith-2vcpu-ubuntu-2404)"
        required: false
        type: string
        default: ubuntu-latest

jobs:
  plan:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Deliberately the SAME group as the groom/triage pipelines: plan posts
    # comments and edits labels on the same issues, so a repo is never
    # planned while it's being groomed or triaged.
    concurrency:
      group: agent-triage-${{ inputs.target_repo }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # Idle guard: no plan-requested issue → nothing to plan, skip the
      # Claude session entirely. Runs in seconds, free.
      - name: Select issues to plan
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not inline interpolation — keeps caller input out of the script.
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE: ${{ inputs.issue }}
          MAX_ISSUES: ${{ inputs.max_issues }}
        run: |
          ISSUE="${ISSUE:-0}"           # workflow_dispatch omits the input
          MAX_ISSUES="${MAX_ISSUES:-2}"
          if [ "$ISSUE" != "0" ]; then
            ISSUES="$ISSUE"
          else
            # Oldest-first so long-waiting issues get planned before fresh
            # ones; needs-human/blocked always win over the plan-requested gate.
            ISSUES=$(gh issue list --repo "$TARGET_REPO" --state open \
              --label plan-requested --limit 100 --json number,labels \
              --jq '[.[] | select(
                ([.labels[].name] | map(. == "needs-human" or . == "blocked") | any) | not
              ) | .number] | sort | .[]' | head -n "$MAX_ISSUES" | xargs)
          fi
          COUNT=$(echo "$ISSUES" | wc -w | tr -d ' ')
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Issues to plan: ${ISSUES:-none}"

      - name: Checkout control repo (CLI + prompts)
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: jirathip-k/agent-ops
          path: agent-ops

      - name: Checkout target repo
        if: steps.precheck.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Install uv
        if: steps.precheck.outputs.count != '0'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        if: steps.precheck.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run plan
        if: steps.precheck.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Via env, not inline interpolation — keeps caller input out of the script.
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUES: ${{ steps.precheck.outputs.issues }}
        working-directory: agent-ops
        run: |
          # Register the gate label up front so humans can apply it in fresh
          # repos and the --remove-label below never trips on a missing label.
          gh label create plan-requested --repo "$TARGET_REPO" --color 1d76db \
            --description "Human asked the agent to post an implementation plan" --force
          FAILED=""
          for N in $ISSUES; do
            echo "::group::plan issue #$N"
            if uv run agent plan "$N" --post -C "$GITHUB_WORKSPACE/target"; then
              # Done: drop the gate label so the next run doesn't redo it.
              gh issue edit "$N" --repo "$TARGET_REPO" \
                --remove-label plan-requested || true
            else
              # A failed plan must fail the run visibly — but only after the
              # remaining issues get their turn.
              FAILED="$FAILED $N"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Plan failed for issue(s):$FAILED"
            exit 1
          fi
