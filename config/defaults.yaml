# Platform-wide defaults. Every project's .agent/config.yaml is merged on top
# of this file (project values win). Keep this file conservative — projects
# opt IN to more autonomy, never out of safety.

base_branch: main
worktree_dir: .worktrees

runtime:
  name: claude_code        # claude_code | codex
  model: null              # runtime default
  permission_mode: acceptEdits    # headless runs (`implement`/`resume`)
  # Interactive sessions (`agent spawn`). Higher than the headless mode on
  # purpose: nobody is watching a delegated worker, and a prompt it cannot
  # answer stalls it until a human clicks — which the stop hook then reports
  # as `halted`. It runs in a throwaway worktree; tighten per project here or
  # per spawn with `agent spawn --permission-mode`.
  interactive_permission_mode: bypassPermissions
  max_turns: null
  stream: true             # print agent activity (tool calls, text) live —
                           # makes Orca terminals show real progress

# Tier names → concrete models, per runtime. A tier names a *job*, not a
# vendor: `smart` is the planning-and-review tier (few tokens, high leverage),
# `fast` is the implementation tier (the workhorse). Roles below reference
# tiers, so swapping the whole fleet is a one-line edit here.
#
# Every runtime needs its own table: what a model string means is the runtime's
# business, and a tier missing for the runtime a role actually runs on is a
# named error at resolution (config.ModelTierError), never a foreign model name
# handed to a CLI. `agent doctor` lists the resolved model per runtime per role
# and flags the gaps. Whether a value tracks new releases on its own is a
# per-provider property — do not assume it; see docs/workflow.md for how to
# check a table against the vendor's models API.
model_tiers:
  claude_code:
    smart: fable           # planning & review: highest-leverage tokens
    fast: sonnet           # implementation: the workhorse

# Per-runtime fallback ladders (full sequence, best first): when the active
# model is unavailable (spend limit, unsupported, retired), run_with_fallback
# steps down to the next rung instead of dying with nowhere to go. See
# docs/workflow.md for how to refresh these against the Models API.
# A project that overrides model_tiers must override model_fallbacks to match:
# the ladder is only trimmed to the rungs below the active model when that
# model is on it, so pointing a tier at something off-ladder keeps the whole
# sequence and can step UP into a costlier model the project never chose.
model_fallbacks:
  claude_code:
    smart: [fable, opus, sonnet]
    fast: [sonnet, haiku]

# Per-role overrides (fan-out): unset fields inherit from `runtime` above.
# Planning and review are cheap in tokens but high in leverage, so they get
# the smart tier; implementation runs on the fast tier.
# planner/reviewer use "default" permission mode: read-only tools are
# auto-allowed, writes are denied (headless has nobody to approve them), and
# gate commands are pre-approved — so they can run tests/typecheck to verify
# without being able to modify anything. "plan" mode is avoided: it blocks
# gate commands and makes Claude write plan files instead of answering.
agents:
  planner:
    model: smart
    permission_mode: default
  implementer:
    model: fast            # does the bulk work, write access
  reviewer:
    model: smart
    permission_mode: default

commands:
  setup: null              # run once per fresh worktree, e.g. "npm install"
  test: null               # e.g. "uv run pytest -q" / "npm test"
  lint: null               # e.g. "uv run ruff check ."
  typecheck: null          # e.g. "uv run pyright"
  requires: []             # binaries the gates need on PATH, e.g. [node, npm, hugo];
                           # resolved (never installed) after `setup` in each worktree

loop:
  max_attempts: 3          # implement attempts before escalating to a human
  gates: [test, lint, typecheck]   # run in order; gates without a command are skipped
  gate_timeout_seconds: 1800   # per-gate (and setup) wall clock; a gate that
                           # overruns fails that gate instead of hanging the run
  idle_timeout_seconds: 1200   # streaming runs: kill the child after this long
                           # with no output at all; never a total-duration cap
  run_timeout_seconds: 3000    # non-streaming runs: wall-clock bound, since
                           # there's no output stream to watch for silence
  plan: true               # planner agent runs first; ESCALATE stops the workflow
  self_review: true        # run a read-only review agent before committing

# Agent merges go into base_branch (set it to `staging` per project to use
# the promotion flow); merge.stable_branch is human-only when it is a
# separate branch from base_branch. When they're the same (the single-branch
# model, e.g. both `main`), agents merge straight into it — see
# workflows.merge.evaluate_merge.
merge:
  stable_branch: main
  max_changed_lines: 400
  max_changed_files: 12
  # The caps above count non-test files/lines only; test detection is
  # merge.test_paths, whose defaults live in config.MergeConfig (same pattern
  # as blocked_paths below). Backstop = cap * total_cap_ratio, counting ALL
  # files including tests, so excluding test lines from the caps above still
  # leaves a ceiling on total diff size. Rationale and owner sign-off for this
  # danger-zone change: issue #136.
  total_cap_ratio: 4
  # blocked_paths defaults live in code (config.MergeConfig); override here
  # per project if needed

# `agent distill` prunes AGENTS.md once it grows past min_lines, leaving
# protected_sections untouched. Both default in code (config.DistillConfig):
# min_lines: 200, protected_sections: the six templates/project/AGENTS.md
# headings. Override protected_sections here if a project renamed them.

skills: [coding, testing]  # platform skills injected into implement prompts
