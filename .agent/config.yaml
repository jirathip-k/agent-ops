# agent-ops managing itself (dogfood project).

base_branch: main

commands:
  test: uv run pytest -q
  lint: uv run ruff check . && uv run ruff format --check . && actionlint -color -shellcheck=
  typecheck: uv run pyright
  requires: [actionlint, uv]

model_tiers:
  codex:
    smart: gpt-5.6-sol
    fast: gpt-5.6-terra

model_fallbacks:
  codex:
    smart: [gpt-5.6-sol, gpt-5.6-terra]
    fast: [gpt-5.6-terra, gpt-5.6-luna]

skills: [coding, testing, documentation]
